name: obsolete merge groups

on:
  delete:
  pull_request:
    paths:
      - .github/workflows/obsolete-merge-groups.yml
      - scripts/ci-obsolete-merge-groups.py

permissions:
  contents: read

jobs:
  contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # CAD-1073: tests/scripts/test_ci_obsolete_merge_groups.py retired
      # with the suite; the delete event still exercises the script live.
      - run: python3 -c "import ast; ast.parse(open('scripts/ci-obsolete-merge-groups.py').read())"

  deleted-group:
    # delete uses default-branch workflow/code, never candidate queue code.
    if: >-
      github.event_name == 'delete' &&
      github.repository == 'favcrm/cadence' &&
      github.event.ref_type == 'branch' &&
      startsWith(github.event.ref, 'gh-readonly-queue/main/pr-')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci-obsolete-merge-groups.py
          sparse-checkout-cone-mode: false
      - name: Retain active and main evidence; cancel proven obsolete groups
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-obsolete-merge-groups.py --apply

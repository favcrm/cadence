name: mutation

# A deliberate guard removal must fail its exact adversarial test, not
# consume the entire ordinary suite or be reported as a broken release.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Mutation branch or full SHA in this repository
        required: true
        type: string
      target:
        description: Cargo integration test target (for example agents_pty)
        required: true
        type: string
      test:
        description: Exact test name expected to fail
        required: true
        type: string

permissions:
  contents: read

jobs:
  mutation:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.revision }}
          path: mutant
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: mutant/ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: mutant/ui
      - name: Install the trusted pinned test runner
        env:
          TMPDIR: ${{ runner.temp }}
          CADENCE_NEXTTEST_INSTALL_DIR: ${{ runner.temp }}/nextest
        run: control/scripts/install-cadence-nextest
      - name: Require an assertion failure from exactly the requested test
        working-directory: mutant
        env:
          CARGO_BUILD_JOBS: 4
          CADENCE_NEXTTEST_BIN: ${{ runner.temp }}/nextest/cargo-nextest
          CADENCE_SUITE_LOCK: ${{ runner.temp }}/mutation.lock
          TARGET: ${{ inputs.target }}
          TEST: ${{ inputs.test }}
        run: python3 ../control/scripts/delivery-candidate.py mutation --target "$TARGET" --test "$TEST"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: mutant/target/nextest/cadence/junit.xml
          if-no-files-found: warn
          retention-days: 14

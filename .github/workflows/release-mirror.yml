name: Mirror published release

# Copy an already published public GitHub Release into the owned release
# store. This is the retry for a tag whose release-publish-r2 job failed
# after the GitHub Release itself succeeded. It does not build, retag, or
# replace published bytes. publish-release.py writes conditionally and
# refuses a different object already stored under the same name.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published v* tag to copy into the owned release store
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  mirror:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # CAD-1506: the release-store write credentials are environment-scoped
    # (branch policy: main and v* tags). This job only ever runs from
    # refs/heads/main, so the policy admits it; no approval click is added.
    environment: release-store
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            scripts/publish-release.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Resolve the published tag and its bundle artifact
        id: release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "tag '$TAG' is not v<version>" >&2; exit 1 ;;
          esac
          case "$TAG" in
            *[!0-9A-Za-z.+_-]*) echo "tag '$TAG' has characters the publisher refuses" >&2; exit 1 ;;
          esac
          sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "tag $TAG does not resolve to a commit" >&2
            exit 1
          fi
          draft=$(gh release view "$TAG" --repo "$GH_REPO" --json isDraft,tagName,publishedAt --jq '[.isDraft, .tagName, (.publishedAt // "")] | @tsv')
          read -r is_draft release_tag published_at <<<"$draft"
          if [ "$is_draft" != "false" ] || [ "$release_tag" != "$TAG" ] || [ -z "$published_at" ]; then
            echo "tag $TAG is not a published GitHub Release" >&2
            exit 1
          fi
          artifact=$(gh api "repos/$GH_REPO/actions/artifacts?name=release-bundles-$TAG&per_page=100" \
            | jq -c --arg sha "$sha" '[.artifacts[] | select(.expired == false and .workflow_run.head_sha == $sha)] | sort_by(.id) | last // empty')
          run_id=$(printf '%s' "$artifact" | jq -r '.workflow_run.id // empty')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "no release-bundles artifact for $TAG at $sha" >&2
            exit 1
          fi
          {
            echo "sha=$sha"
            echo "run_id=$run_id"
            echo "published_at=$published_at"
          } >> "$GITHUB_OUTPUT"
      - name: Download the published archives
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in x86_64-linux aarch64-linux aarch64-macos; do
            asset="cadence-$TAG-$target.tar.gz"
            gh release download "$TAG" --repo "$GH_REPO" --dir dist --pattern "$asset" --pattern "$asset.sha256"
            (cd dist && sha256sum -c "$asset.sha256")
          done
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundles-${{ inputs.tag }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.release.outputs.run_id }}
          path: dist/bundles
      - name: Publish the owned-store copy
        env:
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.sha }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
          CONFIGURED_ENDPOINT: ${{ vars.RELEASES_R2_ENDPOINT }}
          CONFIGURED_BUCKET: ${{ vars.RELEASES_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASES_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY"
          # CAD-1511: the store is pinned to the dedicated literals, exactly as
          # the automatic publisher gates on them (ci.yml `release-publish-r2`)
          # and release-visibility validates them. A mis-set repository
          # variable refuses here and can never steer this write to another
          # store; the publisher reads the literals, not the variables.
          RELEASES_ENDPOINT="https://87b59a40e130c425e35474687ad98a4f.r2.cloudflarestorage.com"
          RELEASES_BUCKET="agenticos-v2-release-artifacts"
          test "$CONFIGURED_ENDPOINT" = "$RELEASES_ENDPOINT" || {
            echo "RELEASES_R2_ENDPOINT is not the dedicated release store" >&2; exit 1; }
          test "$CONFIGURED_BUCKET" = "$RELEASES_BUCKET" || {
            echo "RELEASES_R2_BUCKET is not the dedicated release store" >&2; exit 1; }
          if [ -f dist/bundles/bundles/build-attestation-x86_64-linux.jsonl ]; then
            mv dist/bundles/bundles/*.jsonl dist/bundles/
          fi
          args=()
          for target in x86_64-linux aarch64-linux aarch64-macos; do
            asset="cadence-$TAG-$target.tar.gz"
            test -f "dist/$asset"
            test -f "dist/bundles/build-attestation-$target.jsonl"
            args+=(--artifact "$asset=dist/$asset:$target:application/octet-stream")
            args+=(--artifact "$asset.sha256=dist/$asset.sha256:$target:text/plain")
            args+=(--artifact "build-attestation-$target.jsonl=dist/bundles/build-attestation-$target.jsonl:$target:application/json")
          done
          test -f dist/bundles/publication-receipt.json
          test -f dist/bundles/publication-attestation.jsonl
          args+=(--artifact "publication-receipt.json=dist/bundles/publication-receipt.json:publication:application/json")
          args+=(--artifact "publication-attestation.jsonl=dist/bundles/publication-attestation.jsonl:publication:application/json")
          # The retry writes the same profile as the automatic publisher and
          # keeps today's effective visibility: the variable was unset in this
          # repository, so `private` is what this path has always written. The
          # private->public flip stays with the `production`-gated
          # release-visibility workflow. Whether a retry should instead
          # reproduce a `public` record directly is an operator decision about
          # an outward action — a one-word change, not a default to widen here.
          python3 scripts/publish-release.py \
            --endpoint "$RELEASES_ENDPOINT" \
            --bucket "$RELEASES_BUCKET" \
            --product cadence --profile public-client \
            --version "$TAG" --source-sha "$SOURCE_SHA" \
            --visibility private \
            --published-at "$PUBLISHED_AT" \
            "${args[@]}"

name: Handover
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  handover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check shell syntax
        run: |
          for script in skills/agent-handover/scripts/*.sh; do
            bash -n "$script"
          done
      # CAD-1073: skills/agent-handover/tests was retired with the suite.
      - name: Lifecycle regressions retired — clean-slate transition
        run: echo 'skills/agent-handover tests retired under CAD-1073; behavior checks return as built.'
  # Not named `qa-verdict`: a job's check run would satisfy a required
  # check of that name, and that context belongs to the reviewer's status.
  verdict-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Shellcheck the verdict script
        run: shellcheck scripts/qa-verdict.sh
      # CAD-1073: tests/scripts/ was retired; the gate's live behavior is
      # exercised by the review/merge path itself until the new suite exists.
      - name: Verdict gate regressions retired — clean-slate transition
        run: echo 'tests/scripts/ retired under CAD-1073; qa-verdict covered by shellcheck + live path.'

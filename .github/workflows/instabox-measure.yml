name: InstaBox measure

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/instabox-measure.yml

# One comparison per ref. A new push replaces a run that has not finished.
concurrency:
  group: instabox-measure-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  RUSTFLAGS: -D warnings

jobs:
  measure:
    name: measure (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, instabox-medium, instabox-large]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Record the machine and the shard nofile raise
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          set -u
          out="$RUNNER_TEMP/machine.txt"
          {
            echo "runner_label=$RUNNER_LABEL"
            echo "runner_name=${RUNNER_NAME:-}"
            echo "runner_environment=${RUNNER_ENVIRONMENT:-}"
            echo "runner_os=${RUNNER_OS:-}"
            echo "runner_arch=${RUNNER_ARCH:-}"
            echo "image_os=${ImageOS:-}"
            echo "image_version=${ImageVersion:-}"
            uname -a
            . /etc/os-release
            echo "os=$PRETTY_NAME"
            getconf GNU_LIBC_VERSION || true
            echo "nproc=$(nproc)"
            awk '/MemTotal|MemAvailable|SwapTotal|SwapFree/ {print}' /proc/meminfo
            df -h / /tmp "$RUNNER_TEMP" || true
            swapon --show || true
            echo "nofile_hard_before=$(ulimit -Hn)"
            echo "nofile_soft_before=$(ulimit -Sn)"
            echo "mold_before=$(command -v mold || true)"
            echo "lld_before=$(command -v ld.lld || true)"
          } > "$out"
          set +e
          sudo prlimit --pid $$ --nofile=1048576:1048576
          echo "prlimit_rc=$?" >> "$out"
          ulimit -n 1048576
          echo "ulimit_rc=$?" >> "$out"
          echo "nofile_hard_after=$(ulimit -Hn)" >> "$out"
          echo "nofile_soft_after=$(ulimit -n)" >> "$out"
          cat "$out" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install the CI Rust toolchain
        run: scripts/ci-rust-toolchain --profile minimal

      - name: Restore the test-shard rust-cache
        id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: gate-test-ld2
          save-if: false

      - name: Enable the fast linker the test shards use
        run: sh "$GITHUB_WORKSPACE/scripts/ci-fast-linker" enable

      - name: Record cache, toolchain and linker
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          set -u
          {
            echo "cache_hit=${CACHE_HIT:-}"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "rustflags=${RUSTFLAGS-}"
            echo "mold=$(command -v mold || true)"
            echo "lld=$(command -v ld.lld || true)"
          } | tee "$RUNNER_TEMP/toolchain.txt" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Time the test-profile compile
        run: |
          set -u
          start=$(date +%s)
          set +e
          if [ -x /usr/bin/time ]; then
            /usr/bin/time -v -o "$RUNNER_TEMP/time.txt" \
              cargo test --no-run --locked --all-targets --features test-seam
            rc=$?
          else
            echo "gnu_time=missing" > "$RUNNER_TEMP/time.txt"
            cargo test --no-run --locked --all-targets --features test-seam
            rc=$?
          fi
          end=$(date +%s)
          {
            echo "wall_s=$((end - start))"
            echo "cargo_rc=$rc"
            echo "mem_after:"
            awk '/MemTotal|MemAvailable|SwapTotal|SwapFree/ {print}' /proc/meminfo
          } | tee "$RUNNER_TEMP/compile.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/time.txt" ]; then
            cat "$RUNNER_TEMP/time.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: Write the measurement report
        if: always()
        run: |
          set -u
          report="$RUNNER_TEMP/measure-report.txt"
          {
            echo "# instabox measure"
            echo "sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo
            for name in machine toolchain compile time; do
              path="$RUNNER_TEMP/$name.txt"
              echo "## $name"
              if [ -f "$path" ]; then
                cat "$path"
              else
                echo "(missing)"
              fi
              echo
            done
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the measurement report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instabox-measure-${{ matrix.runner }}
          path: ${{ runner.temp }}/measure-report.txt
          if-no-files-found: warn
          retention-days: 14

  # CAD-1967: the gate jobs restore caches `cache-warm` saves from
  # ubuntu-latest, and every InstaBox job reported "No cache found". This
  # job answers the narrow question that evidence left open: can
  # instabox-medium save an entry under the gate's own key and restore it
  # on a later run? The first run misses and saves; a re-run of the same
  # pull request restores it. Pull-request caches are scoped to the merge
  # ref, so this cannot seed or poison `main`'s entries.
  cache-roundtrip:
    runs-on: instabox-medium
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - run: scripts/ci-rust-toolchain --profile minimal

      - name: Restore the gate test cache, saving it on a miss
        id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: gate-test-ld2
          save-if: true

      - name: Compile against whatever was restored
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          set -u
          start=$(date +%s)
          cargo test --no-run --locked --all-targets --features test-seam \
            > "$RUNNER_TEMP/cargo.log" 2>&1
          rc=$?
          end=$(date +%s)
          {
            echo "## cache round trip"
            echo "run_id=$GITHUB_RUN_ID"
            echo "cache_hit=${CACHE_HIT:-}"
            echo "wall_s=$((end - start))"
            echo "cargo_rc=$rc"
            echo "compiling_units=$(grep -c '^ *Compiling ' "$RUNNER_TEMP/cargo.log" || true)"
            df -h / /data "$RUNNER_TEMP" || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
          tail -5 "$RUNNER_TEMP/cargo.log" || true
          exit "$rc"

  # CAD-1967: `supported_kernel_abi` refused 6.18.54-instabox, and adding a
  # kernel to that list is a product safety decision, not a runner label.
  # This job gathers the same procfs facts `process_use::validate_completeness`
  # reads, on the GitHub runner the gate uses today and on the InstaBox
  # runner, so the comparison is evidence rather than assumption. Read-only.
  proc-facts:
    name: proc-facts (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, instabox-medium]
    steps:
      - name: Record the procfs facts the deletion proof reads
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          set -u
          echo "## proc facts ($RUNNER_LABEL)" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "runner=$RUNNER_LABEL"
            echo "kernel=$(uname -r)"
            echo "euid=$(id -u)"
            echo "proc_fstype=$(findmnt -no FSTYPE /proc 2>/dev/null || echo unknown)"
            echo
            echo "-- /proc/2/stat --"
            head -c 300 /proc/2/stat 2>/dev/null || echo unreadable
            echo
            echo "-- /proc/2/status --"
            grep -E '^(Name|PPid):' /proc/2/status 2>/dev/null || echo unreadable
            echo
            echo "-- /proc/2/ns/pid --"
            if target=$(readlink /proc/2/ns/pid 2>/dev/null); then
              echo "target=[${target}]"
            else
              echo "readlink_failed"
            fi
            stat -c 'link uid=%u gid=%g mode=%A' /proc/2/ns/pid 2>/dev/null \
              || echo "link stat unavailable"
            echo
            echo "-- /proc/self/ns/pid --"
            readlink /proc/self/ns/pid 2>/dev/null || echo unreadable
            echo
            echo "-- proc mounts --"
            grep -c ' - proc ' /proc/self/mountinfo 2>/dev/null || echo 0
            grep ' /proc' /proc/self/mountinfo 2>/dev/null | head -8 || true
          } | tee -a "$GITHUB_STEP_SUMMARY"

name: InstaBox measure

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/instabox-measure.yml

# One comparison per ref. A new push replaces a run that has not finished.
concurrency:
  group: instabox-measure-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  RUSTFLAGS: -D warnings

jobs:
  measure:
    name: measure (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, instabox-medium, instabox-large]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Record the machine and the shard nofile raise
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          set -u
          out="$RUNNER_TEMP/machine.txt"
          {
            echo "runner_label=$RUNNER_LABEL"
            echo "runner_name=${RUNNER_NAME:-}"
            echo "runner_environment=${RUNNER_ENVIRONMENT:-}"
            echo "runner_os=${RUNNER_OS:-}"
            echo "runner_arch=${RUNNER_ARCH:-}"
            echo "image_os=${ImageOS:-}"
            echo "image_version=${ImageVersion:-}"
            uname -a
            . /etc/os-release
            echo "os=$PRETTY_NAME"
            getconf GNU_LIBC_VERSION || true
            echo "nproc=$(nproc)"
            awk '/MemTotal|MemAvailable|SwapTotal|SwapFree/ {print}' /proc/meminfo
            df -h / /tmp "$RUNNER_TEMP" || true
            swapon --show || true
            echo "nofile_hard_before=$(ulimit -Hn)"
            echo "nofile_soft_before=$(ulimit -Sn)"
            echo "mold_before=$(command -v mold || true)"
            echo "lld_before=$(command -v ld.lld || true)"
          } > "$out"
          set +e
          sudo prlimit --pid $$ --nofile=1048576:1048576
          echo "prlimit_rc=$?" >> "$out"
          ulimit -n 1048576
          echo "ulimit_rc=$?" >> "$out"
          echo "nofile_hard_after=$(ulimit -Hn)" >> "$out"
          echo "nofile_soft_after=$(ulimit -n)" >> "$out"
          cat "$out" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install the CI Rust toolchain
        run: scripts/ci-rust-toolchain --profile minimal

      - name: Restore the test-shard rust-cache
        id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: gate-test-ld2
          save-if: false

      - name: Enable the fast linker the test shards use
        run: sh "$GITHUB_WORKSPACE/scripts/ci-fast-linker" enable

      - name: Record cache, toolchain and linker
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          set -u
          {
            echo "cache_hit=${CACHE_HIT:-}"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "rustflags=${RUSTFLAGS-}"
            echo "mold=$(command -v mold || true)"
            echo "lld=$(command -v ld.lld || true)"
          } | tee "$RUNNER_TEMP/toolchain.txt" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Time the test-profile compile
        run: |
          set -u
          start=$(date +%s)
          set +e
          if [ -x /usr/bin/time ]; then
            /usr/bin/time -v -o "$RUNNER_TEMP/time.txt" \
              cargo test --no-run --locked --all-targets --features test-seam
            rc=$?
          else
            echo "gnu_time=missing" > "$RUNNER_TEMP/time.txt"
            cargo test --no-run --locked --all-targets --features test-seam
            rc=$?
          fi
          end=$(date +%s)
          {
            echo "wall_s=$((end - start))"
            echo "cargo_rc=$rc"
            echo "mem_after:"
            awk '/MemTotal|MemAvailable|SwapTotal|SwapFree/ {print}' /proc/meminfo
          } | tee "$RUNNER_TEMP/compile.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/time.txt" ]; then
            cat "$RUNNER_TEMP/time.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: Write the measurement report
        if: always()
        run: |
          set -u
          report="$RUNNER_TEMP/measure-report.txt"
          {
            echo "# instabox measure"
            echo "sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo
            for name in machine toolchain compile time; do
              path="$RUNNER_TEMP/$name.txt"
              echo "## $name"
              if [ -f "$path" ]; then
                cat "$path"
              else
                echo "(missing)"
              fi
              echo
            done
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the measurement report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instabox-measure-${{ matrix.runner }}
          path: ${{ runner.temp }}/measure-report.txt
          if-no-files-found: warn
          retention-days: 14

  # CAD-1970: the six-shard gate pays one full workspace compile per shard.
  # A single larger runner may be cheaper in summed runner-minutes and no
  # worse on the critical path, but that is a measurement, not a preference.
  # This leg runs the real, unpartitioned `scripts/run-result-tests` — the
  # same isolation, feature set, coverage guard and JUnit contract the gate
  # uses — and records what one machine costs end to end. Compare it with a
  # ci.yml run's job timestamps; do not compare summed test durations.
  full-suite:
    name: full suite (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [instabox-large]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Record the machine
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          set -u
          {
            echo "runner_label=$RUNNER_LABEL"
            echo "runner_name=${RUNNER_NAME:-}"
            uname -srm
            echo "nproc=$(nproc)"
            awk '/MemTotal|MemAvailable/ {print}' /proc/meminfo
            df -h / "$RUNNER_TEMP" || true
          } | tee "$RUNNER_TEMP/machine.txt" | tee -a "$GITHUB_STEP_SUMMARY"

      - run: scripts/ci-rust-toolchain --profile minimal

      - name: Restore the test-shard rust-cache
        id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: gate-test-ld2
          save-if: false

      - name: Enable the fast linker the test shards use
        run: sh "$GITHUB_WORKSPACE/scripts/ci-fast-linker" enable

      - name: Enable shared sccache (read-only; no-op without credentials)
        env:
          SCCACHE_CI_RO_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_RO_ACCESS_KEY_ID }}
          SCCACHE_CI_RO_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_RO_SECRET_ACCESS_KEY }}
          SCCACHE_CI_ENDPOINT: ${{ vars.SCCACHE_R2_ENDPOINT }}
        run: sh "$GITHUB_WORKSPACE/scripts/ci-sccache" enable

      - name: Install pinned nextest
        env:
          TMPDIR: ${{ runner.temp }}
          CADENCE_NEXTTEST_INSTALL_DIR: ${{ runner.temp }}/cadence-nextest-0.9.150
        run: |
          scripts/install-cadence-nextest
          echo "CADENCE_NEXTTEST_BIN=$RUNNER_TEMP/cadence-nextest-0.9.150/cargo-nextest" >> "$GITHUB_ENV"
          echo "CADENCE_SUITE_LOCK=$RUNNER_TEMP/cadence-suite.lock" >> "$GITHUB_ENV"

      - name: Time one unpartitioned suite run at full parallelism
        id: suite
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          set -u
          # cadence-agent-exec custodies high descriptors and fails closed
          # unless the hard RLIMIT_NOFILE clears 70000.
          sudo prlimit --pid $$ --nofile=1048576:1048576 || true
          ulimit -n 1048576 || true
          jobs=$(nproc)
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          start=$(date +%s)
          set +e
          CARGO_BUILD_JOBS=4 scripts/run-result-tests --jobs "$jobs"
          rc=$?
          set -e
          end=$(date +%s)
          echo "wall_s=$((end - start))" >> "$GITHUB_OUTPUT"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "cache_hit=${CACHE_HIT:-}" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Summarise the single-runner cost
        if: always()
        env:
          WALL: ${{ steps.suite.outputs.wall_s }}
          RC: ${{ steps.suite.outputs.rc }}
          JOBS: ${{ steps.suite.outputs.jobs }}
          CACHE_HIT: ${{ steps.suite.outputs.cache_hit }}
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          set -u
          report="$RUNNER_TEMP/full-suite.txt"
          caselog=target/nextest/cadence/junit.xml
          discovered=missing
          executed=missing
          if [ -f "$caselog" ]; then
            discovered=$(grep -o '<testcase ' "$caselog" | wc -l | tr -d ' ')
            executed=$(awk 'BEGIN{RS="<testcase "; n=0} NR>1 && $0 !~ /<skipped/ {n++} END{print n}' "$caselog")
          fi
          {
            echo "## full suite on one runner"
            echo "sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "runner=$RUNNER_LABEL"
            echo "jobs=$JOBS"
            echo "cache_hit=$CACHE_HIT"
            echo "wall_s=$WALL"
            echo "exit=$RC"
            echo "discovered=$discovered"
            echo "executed=$executed"
            echo "The uploaded junit.xml carries every case and its duration;"
            echo "compare wall_s with the ci.yml shard job timestamps, never"
            echo "with summed test durations."
          } | tee "$report" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the reports this run was judged on
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instabox-full-suite-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/full-suite.txt
            ${{ runner.temp }}/machine.txt
            target/nextest/cadence/junit.xml
            target/nextest/cadence/inventory.json
          if-no-files-found: warn
          retention-days: 14


name: Nextest shard benchmark

# Opt-in measurement only. No inputs or required-check policy changes.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  RUSTFLAGS: -D warnings

jobs:
  baseline:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: Install pinned nextest
        env:
          CADENCE_NEXTTEST_INSTALL_DIR: ${{ runner.temp }}/cadence-nextest-0.9.145
          TMPDIR: ${{ runner.temp }}
        run: |
          scripts/install-cadence-nextest
          echo "CADENCE_SUITE_LOCK=$RUNNER_TEMP/cadence-suite.lock" >> "$GITHUB_ENV"
          echo "CADENCE_NEXTTEST_BIN=$RUNNER_TEMP/cadence-nextest-0.9.145/cargo-nextest" >> "$GITHUB_ENV"
      - name: Cold baseline pipeline at dispatch main SHA
        id: measure
        run: python3 scripts/nextest-shard-benchmark.py baseline --output "$RUNNER_TEMP/measurement-baseline"
      - name: Preserve baseline reports, exits and phase logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measurement-baseline
          path: |
            ${{ runner.temp }}/measurement-baseline/*
            !${{ runner.temp }}/measurement-baseline/suite.tar.zst
          if-no-files-found: error
          retention-days: 7
  prepare:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      archive_sha: ${{ steps.measure.outputs.archive_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: Install pinned nextest
        env:
          CADENCE_NEXTTEST_INSTALL_DIR: ${{ runner.temp }}/cadence-nextest-0.9.145
          TMPDIR: ${{ runner.temp }}
        run: |
          scripts/install-cadence-nextest
          echo "CADENCE_SUITE_LOCK=$RUNNER_TEMP/cadence-suite.lock" >> "$GITHUB_ENV"
          echo "CADENCE_NEXTTEST_BIN=$RUNNER_TEMP/cadence-nextest-0.9.145/cargo-nextest" >> "$GITHUB_ENV"
      - name: Cold prepare pipeline at dispatch main SHA
        id: measure
        run: python3 scripts/nextest-shard-benchmark.py prepare --output "$RUNNER_TEMP/measurement-prepare"
      - name: Preserve prepare reports, exits and phase logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measurement-prepare
          path: |
            ${{ runner.temp }}/measurement-prepare/*
            !${{ runner.temp }}/measurement-prepare/suite.tar.zst
          if-no-files-found: error
          retention-days: 7
      - name: Upload prepared archive once
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: suite-archive
          path: ${{ runner.temp }}/measurement-prepare/suite.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  shards:
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      EXPECTED_ARCHIVE_SHA: ${{ needs.prepare.outputs.archive_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: Install pinned nextest
        env:
          CADENCE_NEXTTEST_INSTALL_DIR: ${{ runner.temp }}/cadence-nextest-0.9.145
          TMPDIR: ${{ runner.temp }}
        run: |
          scripts/install-cadence-nextest
          echo "CADENCE_SUITE_LOCK=$RUNNER_TEMP/cadence-suite.lock" >> "$GITHUB_ENV"
          echo "CADENCE_NEXTTEST_BIN=$RUNNER_TEMP/cadence-nextest-0.9.145/cargo-nextest" >> "$GITHUB_ENV"
      - name: Download preparation evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: measurement-prepare
          path: ${{ runner.temp }}/measurement-prepare
      - name: Download the same prepared archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: suite-archive
          path: ${{ runner.temp }}/measurement-prepare
      # Extract under the SAME absolute workspace/target layout as preparation.
      # Embedded env! fixture paths cannot be rewritten by runtime remapping.
      # Execution uses metadata, never a Cargo suite rebuild; tests may themselves
      # invoke Cargo/rustc for their existing real fixtures.
      - name: Execute pinned archive partition once
        run: >-
          python3 scripts/nextest-shard-benchmark.py shard-${{ matrix.shard }}
          --prepared "$RUNNER_TEMP/measurement-prepare"
          --output "$RUNNER_TEMP/measurement-shard-${{ matrix.shard }}"
      - name: Preserve shard reports, exits and phase logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measurement-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/measurement-shard-${{ matrix.shard }}/*
          if-no-files-found: error
          retention-days: 7

  experimental-coverage:
    name: Experimental archive coverage (optional)
    if: always() && github.ref == 'refs/heads/main' && github.run_attempt == 1
    needs: [baseline, prepare, shards]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: measurement-*
          path: ${{ runner.temp }}/comparison
      - name: Require successful jobs and exact executed coverage
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 scripts/nextest-shard-benchmark.py aggregate --output "$RUNNER_TEMP/comparison"
          cat "$RUNNER_TEMP/comparison/comparison.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-comparison
          path: ${{ runner.temp }}/comparison
          if-no-files-found: error
          retention-days: 7

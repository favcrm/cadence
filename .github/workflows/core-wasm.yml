name: core-wasm

# CAD-1788: build the cadence-core wasm artifact other hosts consume, and on a
# `core-v*` tag attach it with its sha256 and the contract schemas to a release.
on:
  pull_request:
    paths:
      - "crates/cadence-core/**"
      - "contracts/cadence-core/**"
      - "contracts/board-api/**"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/core-wasm.yml"
  push:
    tags: ["core-v*"]

permissions:
  contents: read

jobs:
  core-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: scripts/ci-rust-toolchain --profile minimal --target wasm32-unknown-unknown
      # Native golden corpus + the check that fails when a committed schema
      # differs from the one generated from the Rust types.
      - run: cargo test -p cadence-core --locked
      - name: Build core.wasm
        env:
          # Path-independent output so the same commit gives the same sha256.
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/src --remap-path-prefix=/home/runner/.cargo=/cargo
        run: |
          set -eu
          cargo build -p cadence-core --target wasm32-unknown-unknown --release --features wasm-abi --locked
          mkdir -p dist
          cp target/wasm32-unknown-unknown/release/cadence_core.wasm dist/core.wasm
          # CAD-1085: generate the Connection contract schemas from the same
          # Rust types (one contract source, no hand-written TS policy).
          cargo run -p cadence-core --locked --example dump_connection_schemas -- dist
          cp contracts/cadence-core/v1/*.schema.json dist/
          for f in contracts/board-api/v1/*.schema.json; do cp "$f" "dist/board-api-$(basename "$f")"; done
          (cd dist && sha256sum core.wasm > core.wasm.sha256)
          echo "contract version: v1" | tee dist/CONTRACT_VERSION
          cat dist/core.wasm.sha256
      # CAD-1085: the custody envelope primitive is a SEPARATE artifact built
      # from the same source with the optional feature. The ordinary core.wasm
      # must not contain any core_custody_* export.
      - name: Build custody-core.wasm
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/src --remap-path-prefix=/home/runner/.cargo=/cargo
        run: |
          set -eu
          cargo build -p cadence-core --target wasm32-unknown-unknown --release --features wasm-abi,custody-crypto --locked
          mkdir -p dist-private
          cp target/wasm32-unknown-unknown/release/cadence_core.wasm dist-private/custody-core.wasm
          (cd dist-private && sha256sum custody-core.wasm > custody-core.wasm.sha256)
          cat dist-private/custody-core.wasm.sha256
      - name: The ordinary artifact has no custody crypto export
        run: |
          set -eu
          if grep -aq 'core_custody_' dist/core.wasm; then
            echo "ordinary core.wasm must not expose custody crypto (CAD-1085)" >&2
            exit 1
          fi
          grep -aq 'core_connection_plan_v1' dist/core.wasm
          grep -aq 'core_custody_' dist-private/custody-core.wasm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cadence-core-wasm
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cadence-core-wasm-custody
          path: dist-private/
          if-no-files-found: error

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/core-v') }}
    needs: core-wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cadence-core-wasm
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cadence-core-wasm-custody
          path: dist/
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "core-v* release $TAG is already published and immutable; tag a new core-v*" >&2
              exit 1
            fi
          else
            gh release create "$TAG" --draft --latest=false --title "$TAG" --notes "cadence-core wasm, contract v1"
          fi
          gh release upload "$TAG" --clobber dist/core.wasm dist/core.wasm.sha256 \
            dist/custody-core.wasm dist/custody-core.wasm.sha256 dist/*.schema.json
          gh release edit "$TAG" --draft=false --latest=false

name: CI selection benchmark

on:
  workflow_dispatch:
    inputs:
      test_path:
        description: Isolated tests/*.rs edit to replay against this ref
        required: true
      doc_path:
        description: Documentation edit to replay against this ref
        required: true

permissions:
  contents: read

jobs:
  test-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        change: [test, docs]
        policy: [full, selected]
    env:
      CARGO_BUILD_JOBS: 4
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Record replay scope
        id: scope
        env:
          CHANGE: ${{ matrix.change }}
          POLICY: ${{ matrix.policy }}
          TEST_PATH: ${{ inputs.test_path }}
          DOC_PATH: ${{ inputs.doc_path }}
        run: |
          python3 - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('policy', 'scripts/ci-test-plan.py')
          policy = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(policy)
          root = Path.cwd()
          path = os.environ['TEST_PATH' if os.environ['CHANGE'] == 'test' else 'DOC_PATH']
          if path.startswith('/') or '..' in Path(path).parts or not (root / path).is_file():
              raise ValueError('replay requires an existing repository file')
          changes = [('M', path)]
          reference = policy.referenced_changes(root, changes)
          targets = {} if policy.doc(path) else policy.metadata_targets(root)
          selected = policy.full('shared reference: ' + reference) if reference else policy.select('pull_request', changes, targets)
          expected = 'selected' if os.environ['CHANGE'] == 'test' else 'docs'
          if selected['mode'] != expected:
              raise ValueError('choose a path eligible for the expected scope: ' + json.dumps(selected))
          plan = policy.full('baseline all-targets replay') if os.environ['POLICY'] == 'full' else selected
          plan.update({'replay': True, 'source_sha': os.environ['GITHUB_SHA'], 'changed_path': path})
          Path(os.environ['RUNNER_TEMP'], 'plan.json').write_text(json.dumps(plan) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('mode=' + plan['mode'] + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('CADENCE_SUITE_LOCK=' + os.environ['RUNNER_TEMP'] + '/cadence-suite.lock\n')
          PY
      - run: scripts/ci-rust-toolchain --profile minimal
        if: steps.scope.outputs.mode != 'docs'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.scope.outputs.mode != 'docs'
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.scope.outputs.mode != 'docs'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.mode != 'docs'
        working-directory: ui
      - name: Install pinned nextest
        if: steps.scope.outputs.mode != 'docs'
        env:
          TMPDIR: ${{ runner.temp }}
          CADENCE_NEXTTEST_INSTALL_DIR: ${{ runner.temp }}/cadence-nextest-0.9.145
        run: |
          scripts/install-cadence-nextest
          echo "CADENCE_NEXTTEST_BIN=$RUNNER_TEMP/cadence-nextest-0.9.145/cargo-nextest" >> "$GITHUB_ENV"
      - name: Verify inventory parity
        if: steps.scope.outputs.mode != 'docs'
        run: python3 scripts/ci-rust-tests.py --root "$GITHUB_WORKSPACE" --plan "$RUNNER_TEMP/plan.json" --phase inventory
      - run: scripts/cadence-nextest --test test_seam --locked
        if: steps.scope.outputs.mode != 'docs'
      - name: Run recorded scope
        run: python3 scripts/ci-rust-tests.py --root "$GITHUB_WORKSPACE" --plan "$RUNNER_TEMP/plan.json" --phase tests
      - run: cargo test --doc --locked
        if: steps.scope.outputs.mode != 'docs'
      - name: Keep evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selection-${{ matrix.change }}-${{ matrix.policy }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/plan.json
            target/nextest/cadence/junit.xml
          retention-days: 14

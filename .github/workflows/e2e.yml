name: CAD611 isolated network evidence (never merge)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cad611-evidence-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.98.1
  RUSTFLAGS: -D warnings
  CARGO_BUILD_JOBS: 4
jobs:
  measurement:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: baseline
            revision: e85b5a88663f07c2c88bd42907527ad44fce5248
          - kind: candidate
            revision: 1ae9852185ea99c8e83f6339c9f17caa9a64bc29
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install 1.98.1 --profile minimal
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Isolated fixture and actual browser measurement
        run: bash scripts/measurements/ci-run.sh '${{ matrix.kind }}' '${{ matrix.revision }}'
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cad611-${{ matrix.kind }}-${{ github.run_id }}
          path: ${{ runner.temp }}/cad611-${{ matrix.kind }}/out
          if-no-files-found: error
          retention-days: 30

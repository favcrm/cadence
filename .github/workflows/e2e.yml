name: e2e

# CAD-433: E2E acceptance tier A — the whole MVP journey in one scripted
# run (scripts/e2e/mvp.sh → tests/e2e_mvp.rs) with fake providers, a
# fake `gh` and a headless board. Nightly and on every `v*` tag, never on
# pull requests: it is not a required check and cannot block a PR. A
# failed run uploads the board screenshots, the daemon's event log and
# logs, the fakes' logs and acceptance.json.

on:
  schedule:
    - cron: '17 3 * * *'
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The toolchain is pinned by rust-toolchain.toml (CAD-927): a nightly failure
  # should be the code's, not a new toolchain's. The install step exports it.
  RUSTFLAGS: -D warnings

jobs:
  mvp:
    # 24.04: Linux with Landlock, which the master's confinement needs —
    # the journey never starts it `--unconfined`. Google Chrome ships on
    # the runner image, so no browser is downloaded.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: scripts/ci-rust-toolchain --export --profile minimal --component clippy
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml
            tests/e2e/pnpm-lock.yaml
      # CAD-1073: tests/e2e_mvp.rs was retired with the suite. The job
      # keeps the release-boundary residual floor — the release binary
      # must still build, and the test-seam feature must refuse to
      # compile in release mode — until the new behavior suite exists.
      - name: MVP journey retired — clean-slate transition
        run: |
          echo 'tests/e2e_mvp.rs retired under CAD-1073.'
          echo 'The MVP journey returns with the new behavior suite.'
          echo 'Release-boundary residual floor: release build + test-seam must fail.'
          # Assert the seam refuses to compile in release mode: the build
          # must FAIL, not merely mention test-seam in its output.
          if cargo build --release --locked --features test-seam; then
            echo 'RELEASE+TEST-SEAM BUILD UNEXPECTEDLY SUCCEEDED'
            exit 1
          fi
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-mvp-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/e2e
            !${{ runner.temp }}/e2e/release
          if-no-files-found: warn
          retention-days: 14

name: e2e

# CAD-1073 reduced window: the MVP journey is retired, not passing.
# Keep the release-seam refusal probe on nightly/tags/dispatch. It needs
# only Cargo, not frontend dependencies or a browser. The job name stays
# compatible; no end-to-end coverage is claimed.

on:
  schedule:
    - cron: '17 3 * * *'
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The toolchain is pinned by rust-toolchain.toml (CAD-927): a nightly failure
  # should be the code's, not a new toolchain's. The install step exports it.
  RUSTFLAGS: -D warnings

jobs:
  mvp:
    # No browser or live daemon is started during the reduced window.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: scripts/ci-rust-toolchain --export --profile minimal
      # Assert the actual compile_error, not any dependency/toolchain failure.
      - name: MVP journey retired — clean-slate transition
        run: |
          echo 'tests/e2e_mvp.rs retired under CAD-1073.'
          echo 'The MVP journey returns with the new behavior suite.'
          echo 'Release-boundary residual floor: release build + test-seam must fail.'
          log="$RUNNER_TEMP/seam-release-check.log"
          if cargo check --release --locked --features test-seam >"$log" 2>&1; then
            echo 'RELEASE+TEST-SEAM CHECK UNEXPECTEDLY SUCCEEDED'
            exit 1
          fi
          cat "$log"
          if ! grep -q 'must never be compiled into a release build' "$log"; then
            echo 'Release probe failed for a reason other than the seam guard' >&2
            exit 1
          fi
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-seam-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seam-release-check.log
          if-no-files-found: warn
          retention-days: 14

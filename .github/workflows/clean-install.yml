name: Clean install (bounded CAD-317)

on:
  pull_request:
    paths:
      - '.github/workflows/clean-install.yml'
      - 'scripts/clean-install.py'
      - 'scripts/install.sh'
      - 'tests/scripts/test_clean_install.py'
      - 'docs/CLEAN-INSTALL.md'
  workflow_dispatch:
    inputs:
      mode:
        description: Candidate artifact or anonymous published URLs
        required: true
        type: choice
        options: [candidate, published]
      tag:
        description: Exact release tag (no latest alias)
        required: true
        type: string
      source_sha:
        description: Full 40-character package source SHA
        required: true
        type: string
      ci_run_id:
        description: Exact producing ci.yml run ID
        required: true
        type: string
      ci_run_attempt:
        description: Exact producing run attempt
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  fixtures:
    name: Installer orchestration fixtures (not native package proof)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Standard-library adversarial tests and harmless executable fixtures
        run: python3 tests/scripts/test_clean_install.py

  native-install:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: install-only (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runner: ubuntu-22.04
          - target: aarch64-linux
            runner: ubuntu-22.04-arm
          - target: aarch64-macos
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      PACKAGE_MODE: ${{ inputs.mode }}
      PACKAGE_TAG: ${{ inputs.tag }}
      PACKAGE_SHA: ${{ inputs.source_sha }}
      PACKAGE_RUN: ${{ inputs.ci_run_id }}
      PACKAGE_ATTEMPT: ${{ inputs.ci_run_attempt }}
      PACKAGE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate dispatch pins
        run: |
          python3 - <<'PY'
          import importlib.util, os, re
          spec = importlib.util.spec_from_file_location('smoke', 'scripts/clean-install.py')
          smoke = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(smoke)
          smoke.valid_inputs(smoke.REPO, os.environ['PACKAGE_TAG'], os.environ['PACKAGE_SHA'], os.environ['PACKAGE_TARGET'])
          for name in ('PACKAGE_RUN', 'PACKAGE_ATTEMPT'):
              if not re.fullmatch(r'[1-9][0-9]*', os.environ[name]):
                  raise SystemExit('invalid positive decimal pin: ' + name)
          PY
      - name: Acquire pinned unpublished candidate (read-only token here only)
        if: inputs.mode == 'candidate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/clean-install.py acquire-candidate \
            --tag "$PACKAGE_TAG" --sha "$PACKAGE_SHA" --target "$PACKAGE_TARGET" \
            --run-id "$PACKAGE_RUN" --attempt "$PACKAGE_ATTEMPT" \
            --out "$RUNNER_TEMP/package"
      - name: Acquire anonymous actual published URLs
        if: inputs.mode == 'published'
        run: |
          python3 scripts/clean-install.py acquire-published \
            --tag "$PACKAGE_TAG" --sha "$PACKAGE_SHA" --target "$PACKAGE_TARGET" \
            --out "$RUNNER_TEMP/package"
      - name: Install, version, custom prefix and stable reruns (no acquisition token)
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, pathlib, shutil, subprocess, sys
          spec = importlib.util.spec_from_file_location('smoke', 'scripts/clean-install.py')
          smoke = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(smoke)
          env = os.environ
          package = pathlib.Path(env['RUNNER_TEMP']) / 'package'
          evidence = pathlib.Path(env['RUNNER_TEMP']) / 'clean-install-evidence'
          evidence.mkdir()
          manifest = json.loads((package / 'manifest.json').read_text())
          smoke.check_manifest(manifest, env['PACKAGE_TAG'], env['PACKAGE_SHA'], env['PACKAGE_TARGET'],
                               int(env['PACKAGE_RUN']), int(env['PACKAGE_ATTEMPT']))
          for name in ('receipt.json', 'manifest.json', 'wait.json'):
              if (package / name).exists():
                  shutil.copyfile(package / name, evidence / name)
          (evidence / 'producer.json').write_text(json.dumps({
              'workflow_source_sha': env['GITHUB_SHA'], 'workflow_run_id': env['GITHUB_RUN_ID'],
              'workflow_run_attempt': env['GITHUB_RUN_ATTEMPT'], 'mode': env['PACKAGE_MODE'],
              'tag': env['PACKAGE_TAG'], 'package_source_sha': env['PACKAGE_SHA'],
              'package_run_id': int(env['PACKAGE_RUN']), 'package_run_attempt': int(env['PACKAGE_ATTEMPT']),
              'target': env['PACKAGE_TARGET'], 'full_cad317_acceptance': False}, indent=2) + '\n')
          argv = [sys.executable, 'scripts/clean-install.py', 'harness',
                  '--installer', str(package / 'install.sh'), '--tag', env['PACKAGE_TAG'],
                  '--sha', env['PACKAGE_SHA'], '--target', env['PACKAGE_TARGET'],
                  '--expect-sha256', manifest['sha256'], '--mode', env['PACKAGE_MODE'],
                  '--out', str(evidence / 'harness.json')]
          if env['PACKAGE_MODE'] == 'candidate':
              mirror = pathlib.Path(env['RUNNER_TEMP']) / 'candidate-mirror'
              version = mirror / env['PACKAGE_TAG']
              version.mkdir(parents=True)
              asset = 'cadence-' + env['PACKAGE_TAG'] + '-' + env['PACKAGE_TARGET'] + '.tar.gz'
              for name in (asset, asset + '.sha256'):
                  shutil.copyfile(package / name, version / name)
              argv += ['--base-url', mirror.as_uri()]
          # Application environment is independently rebuilt by the harness;
          # it cannot inherit this controller's credentials or toolchain PATH.
          result = subprocess.run(argv, text=True, capture_output=True)
          (evidence / 'harness.stdout').write_text(result.stdout)
          (evidence / 'harness.stderr').write_text(result.stderr)
          (evidence / 'harness.rc').write_text(str(result.returncode) + '\n')
          sys.exit(result.returncode)
          PY
      - name: Preserve small receipts, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clean-install-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/clean-install-evidence/
            ${{ runner.temp }}/package/receipt.json
            ${{ runner.temp }}/package/wait.json
          if-no-files-found: warn
          retention-days: 14

name: native-fixture-exclusion

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - src/test_seam.rs
      - src/installer_bundle/**
      - src/bin/cadence-root-constructor/**
      - scripts/acceptance/cad1159-native-fixture/**
      - .github/workflows/native-fixture-exclusion.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-exclusion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: scripts/ci-rust-toolchain --profile minimal
      - name: Run independent C1 matrix on this isolated runner
        env:
          CAD1159_RUNNER_ADMISSION_ID: github-actions:${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          set -eu
          parent=$(mktemp -d "$RUNNER_TEMP/cad1159-c1.XXXXXX")
          echo "CAD1159_C1_OUTPUT=$parent/result" >> "$GITHUB_ENV"
          python3 scripts/acceptance/cad1159-native-fixture/check-release-exclusion.py \
            "$GITHUB_WORKSPACE" "$parent/result"
      - name: Retain report and all case logs, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cad1159-c1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CAD1159_C1_OUTPUT }}/report.json
            ${{ env.CAD1159_C1_OUTPUT }}/logs/
          if-no-files-found: warn
          retention-days: 14

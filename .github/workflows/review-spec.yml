              }
              if (c.result === 'na' ? c.citations.length !== 0 : c.citations.length === 0) bad(`check ${c.name} is ${c.result} with ${c.citations.length} citations`);
              if (c.result === 'fail') fails++;
              if (c.result === 'pass') passes++;

name: ci

on:
  pull_request:
  # GitHub merge queue (CAD-290): each queued PR is tested on top of main
  # (and of the PRs ahead of it) on a gh-readonly-queue/* ref, so a PR
  # no longer needs a manual update-branch + rerun every time main moves.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, 'feat/**']
    # CAD-311: a `v*` tag runs every gate on the tagged commit, then the
    # release-* jobs below publish it to GitHub Releases.
    tags: ['v*']

# Concurrency policy (CAD-228, CAD-409; docs/SESSION.md "Post-merge CI on
# main"):
# - pull_request: one group per PR number; a new head cancels the running
#   and the pending run for that PR (stale PR work is never verified).
# - push to main: one group per commit (`ci-main-<sha>`), so a push run
#   never waits behind another main push run and its release jobs start as
#   soon as runners allow. Each group only ever holds that one run, so no
#   push run is cancelled or dropped. Every pushed commit still gets its
#   own run (CAD-228); see queue-evidence below for what that run does.
# - push to feat/** and v* tags: one group per ref; serial, never
#   cancelled, `queue: max` keeps up to 100 pending runs instead of
#   GitHub's default single pending slot (where a newer push cancelled the
#   older pending run with zero jobs). Only a 101st waiting push is
#   cancelled.
# - merge_group: each queue entry has its own gh-readonly-queue/* ref, so
#   it gets its own group, is never cancelled, and uses `queue: max`.
# GitHub rejects `queue: max` together with `cancel-in-progress: true`, so
# both are chosen by event and never meet in one run.
concurrency:
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && format('main-{0}', github.sha)) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # CAD-409: with the merge queue (CAD-290), GitHub merges a queue entry by
  # moving main to the exact commit its merge_group run tested, so a push
  # run for that sha would re-test identical content. On a push to main
  # this job looks for that evidence: a merge_group run of this workflow
  # on a gh-readonly-queue/main/* ref whose head is exactly this sha and
  # whose latest attempt has fmt, clippy, test, build and ui all
  # `success`. When found, the five gates below are skipped here and the
  # run only builds and attests the release. When not found (a direct or
  # admin-bypass push, a queue entry whose gates did not all pass, or a
  # failed lookup), `tested` is false and every gate runs on this push as
  # before. It never fails the run: any lookup error means "not found".
  # On tags and feat/** it only reports false (tags keep every gate,
  # CAD-311). On pull_request and merge_group it is skipped, and the gates
  # run because their `if` tolerates a skipped need.
  queue-evidence:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      tested: ${{ steps.find.outputs.tested }}
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Find a merge_group run that passed every gate on this sha
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -uo pipefail
          tested=false
          run_id=
          if [ "$REF" = refs/heads/main ]; then
            if ids=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$SHA&per_page=20" \
                --jq '.workflow_runs[] | select(.head_sha == $ENV.SHA and (.head_branch | startswith("gh-readonly-queue/main/"))) | .id'); then
              for id in $ids; do
                if passed=$(gh api "repos/$REPO/actions/runs/$id/jobs?filter=latest&per_page=100" \
                    --jq '[.jobs[] | select(.conclusion == "success") | .name] as $ok
                          | ["fmt", "clippy", "test", "build", "ui"] | all(. as $g | $ok | any(.[]; . == $g))'); then
                  if [ "$passed" = true ]; then
                    tested=true
                    run_id=$id
                    break
                  fi
                  echo "merge_group run $id: not every gate passed"
                else
                  echo "::warning::could not read the jobs of merge_group run $id; running the gates here"
                fi
              done
            else
              echo "::warning::could not list merge_group runs for $SHA; running the gates here"
            fi
          fi
          if [ "$tested" = true ]; then
            msg="gates skipped: merge_group run $run_id passed fmt, clippy, test, build and ui on $SHA"
          else
            msg="gates run here: no merge_group run passed every gate on $SHA ($REF)"
          fi
          echo "$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  # The five required gates. Each needs queue-evidence only to read its
  # verdict: `!cancelled()` replaces the default success() check, so a
  # skipped queue-evidence (pull_request, merge_group) or a failed one
  # still runs the gate; only `tested == 'true'` skips it.
  fmt:
    needs: [queue-evidence]
    if: ${{ !cancelled() && needs.queue-evidence.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --all -- --check
      # Metadata-only target/feature validation catches review-recipe drift
      # without compiling another Rust configuration (CAD-635).
      - run: python3 scripts/check-review-recipe
      - run: python3 scripts/test-review-recipe
      # CAD-582: design tokens are generated from ui/src/styles.css —
      # fail when design/tokens.* is stale against it.
      - run: scripts/design-kit --check

  clippy:
    needs: [queue-evidence]
    if: ${{ !cancelled() && needs.queue-evidence.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo clippy --all-targets --locked -- -D warnings
      # CAD-482: the test seam's gated code is dead to a default clippy
      # run — lint the feature-on shape too so it cannot rot.
      - run: cargo clippy --all-targets --locked --features test-seam -- -D warnings

  test:
    needs: [queue-evidence]
    if: ${{ !cancelled() && needs.queue-evidence.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install stable --profile minimal
      # CAD-264: the review's UI typecheck gate is tested against the real
      # tsc in ui/node_modules, which `cadence review` links in prepare.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      # PR93 is an explicit dependency of this CI follow-up. Its installer
      # and wrapper verify the reviewed archive/binary, force retries=0, and
      # force --no-tests fail; no tool is installed into PATH or the repo.
      - name: Install pinned cargo-nextest (PR93 dependency)
        env:
          CADENCE_NEXTTEST_INSTALL_DIR: ${{ runner.temp }}/cadence-nextest-0.9.145
          TMPDIR: ${{ runner.temp }}
        run: |
          scripts/install-cadence-nextest
          echo "CADENCE_NEXTTEST_BIN=${RUNNER_TEMP}/cadence-nextest-0.9.145/cargo-nextest" >> "$GITHUB_ENV"
      # The all-targets inventory must be non-empty and exactly equal between
      # Cargo and nextest before the process-per-test runner starts. This
      # covers lib, bin and every tests/ binary; it is not one suite only.
      # CAD-482: the suite runs under the `test-seam` feature so fixture
      # daemons and boards exercise the asserted-identity seam (a debug
      # build; release builds can never carry it — see the build job).
      - name: Verify all-targets inventory parity
        env:
          CARGO_BUILD_JOBS: 4
        run: scripts/nextest-inventory all-targets --features test-seam
      # CAD-562: the CAD-536 generated tree must stay consistent with its
      # manifest — every declared item and every #[test] fn accounted
      # for (tests/split_map_inventory.rs is the suite-side twin check).
      - name: Verify doctor/host split-map consistency
        run: scripts/split-doctor-host --check
      - name: Run all Rust targets with pinned nextest
        env:
          CADENCE_SUITE_LOCK: ${{ runner.temp }}/cadence-suite.lock
          CARGO_BUILD_JOBS: 4
        run: scripts/cadence-nextest --all-targets --locked --features test-seam
      # cargo-nextest intentionally does not execute Rust doctests. Keep
      # doctests visible as a separate locked Cargo step rather than silently
      # dropping that coverage from cargo test --all-targets semantics.
      - name: Run Rust doctests with locked Cargo
        env:
          CARGO_BUILD_JOBS: 4
        run: cargo test --doc --locked

  build:
    needs: [queue-evidence]
    if: ${{ !cancelled() && needs.queue-evidence.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install stable --profile minimal
      - run: cargo build --release --locked
      # CAD-482: the test seam must never reach a release binary —
      # the canary exists only under the feature, so this grep on the
      # shipped default-feature binary proves its bytes carry none of
      # the seam. The step below is the guard's own tripwire: it builds
      # the forbidden combination and asserts the compile_error fires.
      - name: Assert the release binary carries no test seam
        run: |
          if grep -aq 'cadence-test-seam-v1' target/release/cadence; then
            echo "release binary contains the CAD-482 test seam" >&2
            exit 1
          fi
      # CAD-482: the grep above proves the shipped binary carries no
      # seam, but the exclusion itself needs a tripwire — a deleted
      # compile_error would leave this whole job green. This probe
      # builds the forbidden combination and asserts it fails with the
      # seam's own compile_error message (any other failure — a missing
      # dep, a syntax error — must not count, so grep the message).
      - name: Assert the test seam refuses a release build
        run: |
          log="${{ runner.temp }}/seam-release-check.log"
          if cargo check --release --locked --features test-seam >"$log" 2>&1; then
            echo "::error::'cargo check --release --features test-seam' succeeded — the seam's release exclusion was removed" >&2
            exit 1
          fi
          cat "$log"
          if ! grep -q 'must never be compiled into a release build' "$log"; then
            echo "::error::release+test-seam failed, but not with the seam's compile_error — the probe must name the guard it tests" >&2
            exit 1
          fi
          echo "probe ok: --release --features test-seam is refused by the seam's own compile_error"

  ui:
    needs: [queue-evidence]
    if: ${{ !cancelled() && needs.queue-evidence.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:url-state
      - run: pnpm build
      - run: cargo build --release --locked --features ui
        working-directory: ${{ github.workspace }}

  # CAD-334: keep the exact tested main build. Runs only on a push to main
  # (never pull_request or merge_group), and only when every gate passed
  # on this same sha: either in this run (a direct push, or no queue
  # evidence), or in the merge_group run queue-evidence found (CAD-409),
  # whose gates are then skipped here. manifest.json records which run
  # holds the checks (`checks_event`, `checks_run_id`), so its `checks`
  # list stays true.
  # The `if` spells out the needs' results: skipped gates would otherwise
  # skip this job, because a job's default success() check fails when a
  # job it needs was skipped.
  # Two jobs, so third-party build code (cargo build scripts, pnpm
  # packages) never runs with `id-token: write`:
  # - release-artifact builds with `contents: read` only and uploads the
  #   dist as an intermediate artifact;
  # - release-attest runs no repo code: it downloads that dist, re-checks
  #   its sha256 and manifest, attests the binary, and uploads the final
  #   `cadence-<sha>-x86_64-linux` that `cadence upgrade` installs.
  # The toolchain is the same floating `stable` the test jobs use, so the
  # release build matches what was tested; the exact rustc/cargo versions
  # are recorded in manifest.json. Neither job is a required check.
  release-artifact:
    needs: [queue-evidence, fmt, clippy, test, build, ui]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.queue-evidence.outputs.tested == 'true' ||
      (needs.fmt.result == 'success' && needs.clippy.result == 'success' &&
      needs.test.result == 'success' && needs.build.result == 'success' &&
      needs.ui.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    # CAD-379: the digest of the bytes this job built, handed to
    # release-attest outside the artifact so a swapped artifact cannot
    # vouch for itself.
    outputs:
      sha256: ${{ steps.assemble.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: rustup toolchain install stable --profile minimal
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm build
        working-directory: ui
      - run: cargo build --release --locked --features ui
      - name: Assemble binary, sha256 and manifest
        id: assemble
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          QUEUE_TESTED: ${{ needs.queue-evidence.outputs.tested }}
          QUEUE_RUN_ID: ${{ needs.queue-evidence.outputs.run_id }}
        run: |
          set -euo pipefail
          # Which run's gates vouch for `checks` (CAD-409).
          if [ "$QUEUE_TESTED" = true ]; then
            checks_event=merge_group checks_run_id=$QUEUE_RUN_ID
          else
            checks_event=push checks_run_id=$RUN_ID
          fi
          mkdir -p dist
          cp target/release/cadence dist/cadence
          chmod 0755 dist/cadence
          # The binary must report the commit it was built from.
          version=$(dist/cadence --version)
          case "$version" in
            *"+$SOURCE_SHA") ;;
            *) echo "binary reports '$version', expected +$SOURCE_SHA" >&2; exit 1 ;;
          esac
          (cd dist && sha256sum cadence > cadence.sha256)
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --argjson run_id "$RUN_ID" \
            --argjson run_attempt "$RUN_ATTEMPT" \
            --arg rustc "$(rustc --version)" \
            --arg cargo "$(cargo --version)" \
            --arg sha256 "$(cut -d' ' -f1 dist/cadence.sha256)" \
            --arg checks_event "$checks_event" \
            --argjson checks_run_id "$checks_run_id" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{source_sha: $source_sha, run_id: $run_id, run_attempt: $run_attempt,
              rustc: $rustc, cargo: $cargo, features: ["ui"],
              target: "x86_64-linux", runner: "ubuntu-24.04",
              checks: ["fmt", "clippy", "test", "build", "ui"],
              checks_event: $checks_event, checks_run_id: $checks_run_id,
              sha256: $sha256, built_at: $built_at}' > dist/manifest.json
          cat dist/manifest.json dist/cadence.sha256
          echo "sha256=$(cut -d' ' -f1 dist/cadence.sha256)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-${{ github.sha }}
          path: |
            dist/cadence
            dist/cadence.sha256
            dist/manifest.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  release-attest:
    needs: [release-artifact]
    # Explicit result check: release-artifact's skipped gate needs (queue
    # evidence found) would fail the default success() here too.
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.release-artifact.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-build-${{ github.sha }}
          path: dist
      - name: Re-check sha256 and manifest against the built digest
        working-directory: dist
        env:
          SOURCE_SHA: ${{ github.sha }}
          BUILT_SHA256: ${{ needs.release-artifact.outputs.sha256 }}
        run: |
          set -euo pipefail
          # The downloaded binary must be the bytes release-artifact built,
          # by the digest it passed as a job output (not read from the
          # artifact itself), before anything is attested.
          if ! [[ "$BUILT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "release-artifact passed no sha256 output ('$BUILT_SHA256')" >&2
            exit 1
          fi
          actual=$(sha256sum cadence | cut -d' ' -f1)
          if [ "$actual" != "$BUILT_SHA256" ]; then
            echo "downloaded cadence hashes to $actual, release-artifact built $BUILT_SHA256" >&2
            exit 1
          fi
          sha256sum -c cadence.sha256
          test "$(cut -d' ' -f1 cadence.sha256)" = "$BUILT_SHA256"
          test "$(jq -r .source_sha manifest.json)" = "$SOURCE_SHA"
          test "$(jq -r .sha256 manifest.json)" = "$BUILT_SHA256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/cadence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cadence-${{ github.sha }}-x86_64-linux
          path: |
            dist/cadence
            dist/cadence.sha256
            dist/manifest.json
          if-no-files-found: error
          retention-days: 90
          # A re-run of this job re-attests the same sha in the same run.
          overwrite: true

  # CAD-311: a `v*` tag publishes a GitHub Release that install.sh
  # installs. Same shape as release-artifact/release-attest above: the
  # builds run with `contents: read` only; release-publish runs no repo
  # code (it only reads install.sh) and is the one job that can attest
  # and write the release. Every leg needs all five gates on the tagged
  # commit (queue-evidence reports false for tags, so they always run
  # and no need of this chain is ever skipped), and release-gate refuses
  # a tag that is not on main or does not match Cargo.toml's version.
  #
  # Assets, per target (x86_64-linux, aarch64-linux, aarch64-macos):
  #   cadence-<tag>-<target>.tar.gz         cadence, cadence.sha256,
  #                                         manifest.json at the root;
  #                                         the UI is embedded (--features ui)
  #   cadence-<tag>-<target>.tar.gz.sha256  its `sha256sum` line
  # plus scripts/install.sh as `install.sh`. The tarball's three files are the ones `cadence
  # upgrade` keeps in a release dir. Linux builds on 22.04 runners so the
  # binary needs glibc 2.35, not 2.39.
  release-gate:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, build, ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Tag names this version and is on main
        env:
          TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "tag '$TAG' is not v<version>" >&2; exit 1 ;;
          esac
          case "$TAG" in
            *[!0-9A-Za-z.+_-]*) echo "tag '$TAG' has characters install.sh refuses" >&2; exit 1 ;;
          esac
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "cadence-agent") | .version')
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match Cargo.toml version $version — bump it first" >&2
            exit 1
          fi
          # The same rule `cadence upgrade` applies: only commits on main.
          status=$(gh api "repos/$REPO/compare/$SOURCE_SHA...main" --jq .status)
          case "$status" in
            identical | ahead) ;;
            *) echo "$SOURCE_SHA is not on main (compare: $status)" >&2; exit 1 ;;
          esac

  release-build:
    needs: [release-gate]
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-linux
            runner: ubuntu-22.04
          - target: aarch64-linux
            runner: ubuntu-22.04-arm
          - target: aarch64-macos
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: rustup toolchain install stable --profile minimal
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm build
        working-directory: ui
      - run: cargo build --release --locked --features ui
      - name: Assemble tarball, sha256 and manifest
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          RUNNER: ${{ matrix.runner }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          # macOS tar would add AppleDouble `._*` entries.
          COPYFILE_DISABLE: 1
        run: |
          set -euo pipefail
          # shasum ships on both Linux and macOS runners; sha256sum does not.
          sha256() { shasum -a 256 "$1" | cut -d' ' -f1; }
          mkdir -p stage dist
          cp target/release/cadence stage/cadence
          chmod 0755 stage/cadence
          # The binary must report this version and commit.
          version=$(stage/cadence --version)
          if [ "$version" != "cadence ${TAG#v}+$SOURCE_SHA" ]; then
            echo "binary reports '$version', expected 'cadence ${TAG#v}+$SOURCE_SHA'" >&2
            exit 1
          fi
          digest=$(sha256 stage/cadence)
          printf '%s  cadence\n' "$digest" > stage/cadence.sha256
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg version "$TAG" \
            --argjson run_id "$RUN_ID" \
            --argjson run_attempt "$RUN_ATTEMPT" \
            --arg rustc "$(rustc --version)" \
            --arg cargo "$(cargo --version)" \
            --arg target "$TARGET" \
            --arg runner "$RUNNER" \
            --arg sha256 "$digest" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{source_sha: $source_sha, version: $version, run_id: $run_id,
              run_attempt: $run_attempt, rustc: $rustc, cargo: $cargo,
              features: ["ui"], target: $target, runner: $runner,
              checks: ["fmt", "clippy", "test", "build", "ui"],
              sha256: $sha256, built_at: $built_at}' > stage/manifest.json
          asset="cadence-$TAG-$TARGET.tar.gz"
          tar -czf "dist/$asset" -C stage cadence cadence.sha256 manifest.json
          (cd dist && printf '%s  %s\n' "$(sha256 "$asset")" "$asset" > "$asset.sha256")
          cat stage/manifest.json "dist/$asset.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  release-publish:
    needs: [release-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A `v*` tag runs the ci.yml OF THE TAGGED COMMIT, so a tag on an
    # unmerged commit could drop release-gate. Repo settings close that:
    # the `release` environment needs a reviewer and admits only `v*`
    # tags, the "release tags" ruleset (23893821) makes v* tags admin-only,
    # and releases are immutable once published. Consumers verify the
    # attestation's --source-ref and --signer-workflow (INSTALL-AGENT.md).
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # install.sh is published as a release asset; nothing else from the
      # repo is read, and nothing from it runs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: scripts/install.sh
          sparse-checkout-cone-mode: false
          path: src
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-${{ github.ref_name }}-*
          path: dist
          merge-multiple: true
      - name: Re-check every tarball's sha256 and contents
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for target in x86_64-linux aarch64-linux aarch64-macos; do
            asset="cadence-$TAG-$target.tar.gz"
            sha256sum -c "$asset.sha256"
            listing=$(tar -tzf "$asset" | sort | tr '\n' ' ')
            test "$listing" = "cadence cadence.sha256 manifest.json "
          done
          cp ../src/scripts/install.sh install.sh
          ls -l
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/install.sh
      # Published bytes never change under a tag (and immutable releases
      # refuse uploads once published). A new release is created as a
      # draft with every asset, then published last. A draft left by a
      # failed run was never public, so its assets may be replaced. For a
      # published release nothing is uploaded: its assets must be
      # byte-identical to this run's (a no-op re-run), or the job fails.
      - name: Publish the GitHub Release
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=(./*.tar.gz ./*.sha256 install.sh)
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = true ]; then
              gh release upload "$TAG" --clobber "${assets[@]}"
              gh release edit "$TAG" --draft=false
              exit 0
            fi
            mkdir ../published
            gh release download "$TAG" --dir ../published
            (cd ../published && find . -maxdepth 1 -type f -printf '%f\n' | sort) > ../published.list
            printf '%s\n' "${assets[@]#./}" | sort > ../ours.list
            if ! diff ../ours.list ../published.list; then
              echo "release $TAG is already published with a different asset list" >&2
              exit 1
            fi
            for f in "${assets[@]#./}"; do
              if ! cmp -s "$f" "../published/$f"; then
                echo "release $TAG is already published and $f differs — refusing to replace it" >&2
                exit 1
              fi
            done
            echo "release $TAG is already published with identical assets"
            exit 0
          fi
          pre=()
          case "$TAG" in *-*) pre=(--prerelease) ;; esac
          gh release create "$TAG" --draft --verify-tag --title "cadence $TAG" \
            --generate-notes "${pre[@]}" "${assets[@]}"
          gh release edit "$TAG" --draft=false

  # CAD-311: prove the non-x86_64 builds on every PR and queue entry, not
  # first at a tag. Plain `cargo build` (no UI embed): what differs per
  # target is the Rust code under cfg gates and the C/linker toolchain.
  # macOS minutes are free for this public repo.
  cross-build:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux
            runner: ubuntu-22.04-arm
          - target: aarch64-macos
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install stable --profile minimal
      - run: cargo build --locked
      - run: target/debug/cadence --version

  # CAD-109 backstop: gitleaks, an implementation independent of cadence's
  # in-process scanner, runs over the PR's own commits (base..head) with its
  # built-in rule pack, which is the same release cadence vendors. The binary
  # is pinned by version and sha256 (scripts/install-gitleaks), and --redact
  # keeps any finding's value out of the log. PR bodies are not scanned in
  # this phase.
  secrets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks 8.30.1
        env:
          CADENCE_GITLEAKS_INSTALL_DIR: ${{ runner.temp }}/gitleaks-8.30.1
          TMPDIR: ${{ runner.temp }}
        run: scripts/install-gitleaks
      - name: Scan the PR's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks-8.30.1/gitleaks" git --no-banner --redact --verbose \
            --log-opts="$BASE_SHA..$HEAD_SHA" .

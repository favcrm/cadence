name: ci

on:
  # Manual dispatch runs the same six-shard suite as a pull request.
  # CAD-1073 retired the 4/8 width switch; it did not change the matrix.
  # CAD-1970: the isolated C1 native-fixture proof is a deliberately separate
  # dispatch input rather than an unconditional manual-dispatch job. Its
  # constructor source lives in another lane, so a plain dispatch on main used
  # to report a failure for an artifact main never had. The proof itself is
  # unchanged and still runs whenever it is asked for.
  workflow_dispatch:
    inputs:
      native_fixture:
        description: Run the isolated C1 native-fixture release-exclusion proof
        type: boolean
        default: false
  pull_request:
  # GitHub merge queue (CAD-290): each queued PR is tested on top of main
  # (and of the PRs ahead of it) on a gh-readonly-queue/* ref, so a PR
  # no longer needs a manual update-branch + rerun every time main moves.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    # CAD-311: a `v*` tag runs every gate on the tagged commit, then the
    # release-* jobs below publish it to GitHub Releases.
    tags: ['v*']

# Concurrency policy (CAD-228, CAD-409; docs/SESSION.md "Post-merge CI on
# main"):
# - pull_request: one group per PR number; a new head cancels the running
#   and the pending run for that PR (stale PR work is never verified).
# - push to main: one group per commit (`ci-main-<sha>`), so a push run
#   never waits behind another main push run and its release jobs start as
#   soon as runners allow. Each group only ever holds that one run, so no
#   push run is cancelled or dropped. Every pushed commit still gets its
#   own run (CAD-228); see queue-evidence below for what that run does.
# - push to v* tags: one group per ref; serial, never
#   cancelled, `queue: max` keeps up to 100 pending runs instead of
#   GitHub's default single pending slot (where a newer push cancelled the
#   older pending run with zero jobs). Only a 101st waiting push is
#   cancelled.
# - merge_group: each queue entry has its own gh-readonly-queue/* ref, so
#   it gets its own group, is never cancelled, and uses `queue: max`.
# GitHub rejects `queue: max` together with `cancel-in-progress: true`, so
# both are chosen by event and never meet in one run.
concurrency:
  group: ci-${{ (github.event_name == 'workflow_dispatch' && format('benchmark-{0}', github.run_id)) || github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && format('main-{0}', github.sha)) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# CAD-1967: the Linux gates run on instabox-medium. Its kernel 6.18.54 is
# listed in supported_kernel_abi and both host acceptances (cad1196, cad1377)
# pass there; the test profile compiles in 3:20 against 5:44 on ubuntu-latest.
# `cache-warm` moves with them: Actions cache versions include the cached
# paths, so a writer on a different runner cannot warm these jobs, and a
# consumer moved alone compiles cold. Release, ARM and macOS jobs stay on
# their current labels.
jobs:
  native-fixture-release-exclusion:
    # C1 is an explicitly dispatched, isolated artifact check, not a fixture run.
    if: github.event_name == 'workflow_dispatch' && inputs.native_fixture
    runs-on: instabox-medium
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: scripts/ci-rust-toolchain --profile minimal
      - name: Run independent C1 matrix on this isolated runner
        env:
          CAD1159_RUNNER_ADMISSION_ID: github-actions:${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          set -eu
          parent=$(mktemp -d "$RUNNER_TEMP/cad1159-c1.XXXXXX")
          echo "CAD1159_C1_OUTPUT=$parent/result" >> "$GITHUB_ENV"
          python3 scripts/acceptance/cad1159-native-fixture/check-release-exclusion.py \
            "$GITHUB_WORKSPACE" "$parent/result"
      - name: Retain report and all case logs, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cad1159-c1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CAD1159_C1_OUTPUT }}/report.json
            ${{ env.CAD1159_C1_OUTPUT }}/logs/
          if-no-files-found: warn
          retention-days: 14

  # CAD-926: rust-cache scope. Only `cache-warm` (push to main) SAVES the gate
  # profiles' caches, under the shared keys gate-test-ld2, gate-release,
  # gc2 and gate-release-full (CAD-1493: bump fingerprint epochs when flags
  # change; rust-cache never overwrites an existing key). CAD-1684 updated
  # the test and clippy epochs for the dependency debuginfo change.
  # Every pull_request / merge_group gate job
  # restores the same key and passes `save-if: false`: a queue ref saved
  # ~1.4 GB per run that no other ref could read, and the repo sat at 12.7 GB
  # against a 10 GB limit.
  # release-artifact and release-build keep their own default-keyed caches
  # (they run on main pushes and tags only). cross-build restores the
  # per-target cross-* keys its own cache-warm legs write — restore-only
  # in the gates, like every other shared key.
  # The legacy cache-scope fixture was retired in CAD-1073.
  # CAD-409: with the merge queue (CAD-290), GitHub merges a queue entry by
  # moving main to the exact commit its merge_group run tested, so a push
  # run for that sha would re-test identical content. On a push to main
  # this job looks for that evidence: a merge_group run of this workflow
  # on a gh-readonly-queue/main/* ref whose head is exactly this sha and
  # whose complete latest-attempt inventory has at least one job per
  # gate name and every matching job completed successfully (CAD-420).
  # When found, the five gates below are skipped here and the
  # run only builds and attests the release. When not found (a direct or
  # admin-bypass push, a queue entry whose gates did not all pass, or a
  # failed lookup), `tested` is false and every gate runs on this push as
  # before. It never fails the run: any lookup error means "not found".
  # On tags it only reports false (tags keep every gate,
  # CAD-311). On pull_request and merge_group it is skipped, and the gates
  # run because their `if` tolerates a skipped need.
  queue-evidence:
    if: github.event_name == 'push'
    runs-on: instabox-medium
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      tested: ${{ steps.find.outputs.tested }}
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Find a merge_group run that passed every gate on this sha
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -uo pipefail
          tested=false
          run_id=
          if [ "$REF" = refs/heads/main ]; then
            if ids=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$SHA&per_page=20" \
                --jq '.workflow_runs[] | select(.head_sha == $ENV.SHA and (.head_branch | startswith("gh-readonly-queue/main/"))) | .id'); then
              for id in $ids; do
                if passed=$(gh api "repos/$REPO/actions/runs/$id/jobs?filter=latest&per_page=100" \
                    --paginate --slurp \
                    | jq -r '[.[].jobs[]] as $jobs
                          | ["fmt", "clippy", "build", "ui"] | all(. as $g
                              | [$jobs[] | select(.name == $g)] as $matching
                              | ($matching | length) > 0 and ($matching | all(.status == "completed" and .conclusion == "success")))'); then
                  if [ "$passed" = true ]; then
                    tested=true
                    run_id=$id
                    break
                  fi
                  echo "merge_group run $id: not every gate passed"
                else
                  echo "::warning::could not read the jobs of merge_group run $id; running the gates here"
                fi
              done
            else
              echo "::warning::could not list merge_group runs for $SHA; running the gates here"
            fi
          fi
          if [ "$tested" = true ]; then
            msg="gates skipped: merge_group run $run_id passed fmt, clippy, test, build and ui on $SHA"
          else
            msg="gates run here: no merge_group run passed every gate on $SHA ($REF)"
          fi
          echo "$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  # The five required gates. Each needs queue-evidence only to read its
  # verdict: `!cancelled()` replaces the default success() check, so a
  # skipped queue-evidence (pull_request, merge_group) or a failed one
  # still runs the gate; only `tested == 'true'` skips it.
  # PR feedback selection runs BASE policy, never a PR-provided classifier.
  # Merge groups, main, tags and any uncertainty retain all real gates.
  change-scope:
    runs-on: instabox-medium
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      ui: ${{ steps.scope.outputs.ui }}
      scope: ${{ steps.scope.outputs.scope }}
      tests: ${{ steps.scope.outputs.tests }}
      targets: ${{ steps.scope.outputs.targets }}
      build: ${{ steps.scope.outputs.build }}
      cross: ${{ steps.scope.outputs.cross }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select PR feedback from trusted base; default to full
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          rust=true
          ui=true
          scope=full
          tests=true
          targets='[]'
          build=true
          cross=true
          policy="$RUNNER_TEMP/ci-change-scope.py"
          result="$RUNNER_TEMP/ci-change-scope.json"
          if [ "$EVENT" = pull_request ] && git show "$BASE:scripts/ci-change-scope.py" >"$policy"; then
            if python3 -I "$policy" --repo "$GITHUB_WORKSPACE" --base "$BASE" --head "$HEAD" --event "$EVENT" >"$result"; then
              # The tests scope is emitted only by a base classifier that
              # knows the new fields; legacy docs/ui records still apply.
              if jq -e '(.scope == "docs" and .rust == "false" and .ui == "false" and (.tests // "false") == "false") or (.scope == "ui" and .rust == "false" and .ui == "true" and (.tests // "false") == "false") or (.scope == "tests" and .rust == "true" and .ui == "false" and .tests == "true" and (.targets | type == "array") and (.targets | length) > 0 and (.targets | all(type == "string" and test("^[A-Za-z0-9_]+$")))) or (.scope == "full" and .rust == "true" and .ui == "true") or (.scope == "tests-only" and .rust == "true" and .ui == "false" and .tests == "true" and ((.targets // []) | length) == 0 and .build == "false" and (.cross == "false" or .cross == "true"))' "$result" >/dev/null; then
                rust=$(jq -r .rust "$result")
                ui=$(jq -r .ui "$result")
                scope=$(jq -r .scope "$result")
                tests=$(jq -r .tests "$result")
                build=$(jq -r '.build // "true"' "$result")
                cross=$(jq -r '.cross // "true"' "$result")
                if [ "$scope" = tests ]; then
                  targets=$(jq -c .targets "$result")
                fi
              fi
            fi
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "cross=$cross" >> "$GITHUB_OUTPUT"
          echo "PR feedback scope: $scope; rust=$rust; ui=$ui; tests=$tests; build=$build; cross=$cross; targets=$targets. Merge queue always runs full integration validation." >> "$GITHUB_STEP_SUMMARY"

  fmt:
    needs: [queue-evidence, change-scope]
    if: ${{ !cancelled() && needs.queue-evidence.outputs.tested != 'true' }}
    runs-on: instabox-medium
    timeout-minutes: 10
    steps:
      - name: Not applicable — rust PR feedback gate
        if: ${{ needs.change-scope.outputs.rust == 'false' }}
        run: echo 'rust commands not run for this PR scope; full integration gates still run in the merge queue.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: scripts/ci-rust-toolchain --profile minimal --component rustfmt
        if: ${{ needs.change-scope.outputs.rust != 'false' }}
      # CAD-1970: 27 contract checks, each an interpreter start plus a few
      # seconds of work. As separate steps they cost 44.6 s of a 56 s job,
      # almost all of it process startup in series. One step runs them 8 at a
      # time: measured 13.8 s for the same 27, same results. A failure still
      # names the check and fails the step.
      # CAD-1970: the contract *tests* for this repo's own tooling were
      # retired; what remains are checks, not tests — each one inspects the
      # checkout and fails on a real inconsistency. They run together because
      # each is an interpreter start plus a few seconds.
      # CAD-1970: the contract *tests* for this repo's own tooling are
      # retired — CI machinery is proved by running it. What remains are
      # checks: each inspects the checkout and fails on a real inconsistency.
      - name: Checks for this repo's own tooling
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          xargs -P 4 -I@ sh -c '@ || { echo "::error::check failed: @" >&2; exit 1; }' <<'CHECKS'
            python3 scripts/check-review-recipe
            scripts/design-kit --check
          CHECKS
      - run: cargo fmt --all -- --check
        if: ${{ needs.change-scope.outputs.rust != 'false' }}
      - name: Refuse DDL edits to shipped migration blocks
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 scripts/check-migration-ddl --base "$BASE_SHA"
      - name: Check contributor documentation paths
        run: python3 scripts/check-doc-links.py
      # CAD-833: the live-staging tick is mocked end-to-end — it must
      # run in CI, not only on the deploying host.
      - name: Verify live doctor/host source inventory
        run: scripts/split-doctor-host --check

  clippy:
    needs: [queue-evidence, change-scope]
    if: ${{ !cancelled() && needs.queue-evidence.outputs.tested != 'true' }}
    runs-on: instabox-medium
    timeout-minutes: 20
    steps:
      - name: Not applicable — rust PR feedback gate
        if: ${{ needs.change-scope.outputs.rust == 'false' }}
        run: echo 'rust commands not run for this PR scope; full integration gates still run in the merge queue.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: scripts/ci-rust-toolchain --profile minimal --component clippy
        if: ${{ needs.change-scope.outputs.rust != 'false' }}
      # Rust build cache (pinned): dependency artifacts keyed on
      # toolchain + lockfile; final binaries always rebuild from sources.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ needs.change-scope.outputs.rust != 'false' }}
        with:
          shared-key: gc2
          save-if: false
      - run: cargo clippy --all-targets --locked -- -D warnings
        if: ${{ needs.change-scope.outputs.rust != 'false' }}
      # CAD-482: the test seam's gated code is dead to a default clippy
      # run — lint the feature-on shape too so it cannot rot.
      - run: cargo clippy --all-targets --locked --features test-seam -- -D warnings
        if: ${{ needs.change-scope.outputs.rust != 'false' }}

  build:
    needs: [queue-evidence, change-scope]
    if: ${{ !cancelled() && needs.queue-evidence.outputs.tested != 'true' }}
    runs-on: instabox-medium
    timeout-minutes: 20
    steps:
      - name: Not applicable — rust PR feedback gate
        if: ${{ needs.change-scope.outputs.rust == 'false' && needs.change-scope.outputs.build != 'false' }}
        run: echo 'rust commands not run for this PR scope; full integration gates still run in the merge queue.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: scripts/ci-rust-toolchain --profile minimal
        if: ${{ needs.change-scope.outputs.rust != 'false' && needs.change-scope.outputs.build != 'false' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ needs.change-scope.outputs.rust != 'false' && needs.change-scope.outputs.build != 'false' }}
        with:
          shared-key: gate-release
          save-if: false
      # CAD-1103: the linker flag follows rust-cache, which hashes RUST* env.
      - name: Enable fast linker (mold/lld; falls back to the default linker)
        if: ${{ needs.change-scope.outputs.rust != 'false' && needs.change-scope.outputs.build != 'false' }}
        run: sh $GITHUB_WORKSPACE/scripts/ci-fast-linker enable
      - name: Enable shared sccache (no-op without credentials)
        if: ${{ needs.change-scope.outputs.rust != 'false' && needs.change-scope.outputs.build != 'false' }}
        env:
          SCCACHE_CI_RO_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_RO_ACCESS_KEY_ID }}
          SCCACHE_CI_RO_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_RO_SECRET_ACCESS_KEY }}
          SCCACHE_CI_ENDPOINT: ${{ vars.SCCACHE_R2_ENDPOINT }}
        run: sh $GITHUB_WORKSPACE/scripts/ci-sccache enable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ needs.change-scope.outputs.rust != 'false' && needs.change-scope.outputs.build != 'false' }}
        with:
          bun-version-file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ needs.change-scope.outputs.rust != 'false' && needs.change-scope.outputs.build != 'false' }}
        with:
          node-version: 22
      # CAD-1970: a PR push proves the shipping profile *checks*; the queue and
      # main prove it *links*. Linking, packaging and the seam assertions need
      # the built artifact, so they stay where a broken merge is caught before
      # it lands rather than weeks later at release.
      - run: cargo check --profile ci --locked
        if: ${{ needs.change-scope.outputs.rust != 'false' && needs.change-scope.outputs.build != 'false' && github.event_name == 'pull_request' }}
      - run: cargo build --profile ci --locked
        if: ${{ needs.change-scope.outputs.rust != 'false' && needs.change-scope.outputs.build != 'false' && github.event_name != 'pull_request' }}
      - name: Package and clean-consumer check for the app toolchain
        if: ${{ needs.change-scope.outputs.rust != 'false' && needs.change-scope.outputs.build != 'false' && github.event_name != 'pull_request' }}
        run: scripts/app-toolchain-acceptance.sh "$GITHUB_WORKSPACE/target/ci/cadence"
      - name: Rehearse offline hosted migration with the built CLI
        if: ${{ needs.change-scope.outputs.rust != 'false' && needs.change-scope.outputs.build != 'false' && github.event_name != 'pull_request' }}
        env:
          CADENCE_REHEARSAL_BINARY: ${{ github.workspace }}/target/ci/cadence
        run: python3 scripts/test-hosted-migration.py -v
      # CAD-778: the release binary parses with production features (no
      # dev-deps), so only it proves frozen snapshot digests survive the
      # store round trip — in-lane test binaries mask the default parser
      # via dev-only jsonschema unification. Minimal port of the closed
      # #463 release check; staging-rehearsal/MVP paths deliberately out.
      # CAD-1073: the frozen-digest probe's harness was retired with the
      # suite; the release-binary checks below (test-seam absence and the
      # release+test-seam compile_error tripwire) remain the residual floor.
      # CAD-482: the test seam must never reach a release binary —
      # the canary exists only under the feature, so this grep on the
      # shipped default-feature binary proves its bytes carry none of
      # the seam. The step below is the guard's own tripwire: it builds
      # the forbidden combination and asserts the compile_error fires.
      - name: Assert the ci-profile gate binary carries no test seam
        if: ${{ needs.change-scope.outputs.rust != 'false' && needs.change-scope.outputs.build != 'false' && github.event_name != 'pull_request' }}
        run: |
          if grep -aq 'cadence-test-seam-v1' target/ci/cadence; then
            echo "release binary contains the CAD-482 test seam" >&2
            exit 1
          fi
          # S-VIEW-1 diagnostic seam (src/adapter/pi_guest/diag_seam.rs) marker.
          if grep -aq 'cadence-n1-s-view-1-isolate-seam-refusal-v1' target/ci/cadence; then
            echo "release binary contains the S-VIEW-1 diagnostic seam" >&2
            exit 1
          fi
      # CAD-482: the grep above proves the shipped binary carries no
      # seam, but the exclusion itself needs a tripwire — a deleted
      # compile_error would leave this whole job green. This probe
      # builds the forbidden combination and asserts it fails with the
      # seam's own compile_error message (any other failure — a missing
      # dep, a syntax error — must not count, so grep the message).
      - name: Assert the test seam refuses a release build
        if: ${{ needs.change-scope.outputs.rust != 'false' && needs.change-scope.outputs.build != 'false' && github.event_name != 'pull_request' }}
        run: sh scripts/check-release-test-seam
      # CAD-1970: the `ui` gate's compile, run here so the release cache and
      # the Node/Bun toolchain are paid once. It runs AFTER the two seam
      # assertions above on purpose: `cargo build --features ui` overwrites
      # `target/ci/cadence`, and those assertions must judge the default-feature
      # binary, not the ui one.
      - run: bun install --frozen-lockfile
        if: ${{ needs.change-scope.outputs.rust != 'false' && needs.change-scope.outputs.build != 'false' && needs.change-scope.outputs.ui != 'false' }}
        working-directory: ui
      - run: bun run build
        if: ${{ needs.change-scope.outputs.rust != 'false' && needs.change-scope.outputs.build != 'false' && needs.change-scope.outputs.ui != 'false' }}
        working-directory: ui
      - run: cargo build --profile ci --locked --features ui
        if: ${{ needs.change-scope.outputs.rust != 'false' && needs.change-scope.outputs.build != 'false' && needs.change-scope.outputs.ui != 'false' }}
      - name: sccache statistics
        if: ${{ !cancelled() && needs.change-scope.outputs.rust != 'false' && needs.change-scope.outputs.build != 'false' }}
        run: sh $GITHUB_WORKSPACE/scripts/ci-sccache stats

  ui:
    needs: [queue-evidence, change-scope]
    if: ${{ !cancelled() && needs.queue-evidence.outputs.tested != 'true' }}
    runs-on: instabox-medium
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Not applicable — ui PR feedback gate
        working-directory: ${{ github.workspace }}
        if: ${{ needs.change-scope.outputs.ui == 'false' }}
        run: echo 'ui commands not run for this PR scope; full integration gates still run in the merge queue.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ needs.change-scope.outputs.ui != 'false' }}
        with:
          bun-version-file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ needs.change-scope.outputs.ui != 'false' }}
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
        if: ${{ needs.change-scope.outputs.ui != 'false' }}
      - run: bun run typecheck
        if: ${{ needs.change-scope.outputs.ui != 'false' }}
      - run: bun run lint
        if: ${{ needs.change-scope.outputs.ui != 'false' }}
      - name: Verify app development isolation and HMR
        if: ${{ needs.change-scope.outputs.ui != 'false' }}
        run: node --test ../scripts/app-dev/*.test.mjs
      - run: bun run build
        if: ${{ needs.change-scope.outputs.ui != 'false' }}
      # CAD-1850: consumers vendor exact, committed runtime bytes and hashes.
      # Check the canonical source and deterministic output in this same gate.
      - name: Hosted runtime package checks
        if: ${{ needs.change-scope.outputs.ui != 'false' }}
        working-directory: worker-runtime
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run typecheck
          bun run build
          git diff --exit-code -- dist
      # This job had no install step and built on the runner's preinstalled
      # (floating) Rust; the default working directory here is ui/.
      # CAD-1970: the `--features ui` compile moved into `build`, which already
      # has the release cache and the Node/Bun toolchain. Two jobs each
      # restoring `gate-release` and compiling the same profile was ~110 s of
      # duplicated work for one job's worth of signal. This job keeps every
      # check that can only be made here (typecheck, lint, url-state, app-kit,
      # HMR, the bundle, the hosted runtime package); the compile that proves
      # the binary still builds with the ui feature runs there.
      - name: sccache statistics
        if: ${{ !cancelled() && needs.change-scope.outputs.ui != 'false' }}
        run: sh $GITHUB_WORKSPACE/scripts/ci-sccache stats

  # CAD-904 / CI-SEC-2: the ONLY job that holds the read-write R2 key. It
  # runs on push to main alone, under the `sccache-writer` environment
  # (deployment branch: main only), and compiles merged code. No gate job,
  # no pull_request and no merge_group job sees the key: a queued PR's build
  # scripts and tests run in the gates, which only ever read the cache.
  # Nothing `needs` it and it never fails the run.
  # CAD-926: it is also the ONLY saver of the gate jobs' rust-cache. One leg
  # per profile, each with its own target dir and the shared key the gates
  # restore (gate-test-ld2: test; gate-release: build + ui;
  # gc2: clippy). The rust-cache step precedes `ci-sccache enable`
  # exactly as in the gates, because the cache key hashes RUST* env vars and
  # enable exports RUSTC_WRAPPER. The builds run without sccache too (the saved
  # target dir is the point), but are skipped when the exact cache key already
  # exists (rust-cache would not save) and sccache has nothing to warm.
  cache-warm:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: instabox-medium
    timeout-minutes: 30
    continue-on-error: true
    environment: sccache-writer
    strategy:
      fail-fast: false
      matrix:
        # CAD-1970: no `test` leg — its cache fed the PR test job, which is gone;
        # the nightly has no wall-time budget worth a compile per merge.
        profile: [release, release-full, clippy]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: scripts/ci-rust-toolchain --profile minimal --component clippy
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # CAD-1493: test and clippy carry fingerprint epochs; release stays
          # unversioned. Keep these keys aligned with the gate consumers.
          shared-key: ${{ matrix.profile == 'clippy' && 'gc2' || format('gate-{0}', matrix.profile) }}${{ matrix.profile == 'test' && '-ld2' || '' }}
          # A lint or test failure on main must not freeze the refresh.
          cache-on-failure: true
      # The clippy leg has no sccache: clippy-driver calls are not cacheable
      # and no gate reads clippy objects from it.
      # CAD-1103: the gates' linker flag is part of the cargo fingerprint, so
      # the release leg warms the cache with the same flag the gates use.
      # CAD-1487: the suite enables the fast linker too (its link is
      # the shard bottleneck), so the test leg must warm with it as well.
      - name: Enable fast linker (test and release legs; same flags as the gates)
        if: matrix.profile == 'release'
        run: sh $GITHUB_WORKSPACE/scripts/ci-fast-linker enable
      - name: Enable shared sccache (read-write; no-op without credentials)
        id: sccache
        if: matrix.profile == 'release'
        env:
          SCCACHE_CI_RW_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_RW_ACCESS_KEY_ID }}
          SCCACHE_CI_RW_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_RW_SECRET_ACCESS_KEY }}
          SCCACHE_CI_ENDPOINT: ${{ vars.SCCACHE_R2_ENDPOINT }}
        run: sh $GITHUB_WORKSPACE/scripts/ci-sccache enable
      # CAD-1103: gates build the `ci` profile, so that is what this leg
      # warms (dependencies are shared with the `ui` feature build). release-artifact keeps its own cache.
      - name: Warm the ci profile
        if: matrix.profile == 'release' && (steps.cache.outputs.cache-hit != 'true' || steps.sccache.outputs.enabled == 'true')
        run: cargo build --profile ci --locked
      # CAD-1131: the shipping profile, so the queue's release-queue-build
      # restores warm dependencies (no fast linker or sccache: the same
      # build as release-artifact).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: matrix.profile == 'release-full' && steps.cache.outputs.cache-hit != 'true'
        with:
          bun-version-file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.profile == 'release-full' && steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: 22
      - name: Warm the release profile (queue release build)
        if: matrix.profile == 'release-full' && steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          (cd ui && bun install --frozen-lockfile && bun run build)
          cargo build --release --locked --features ui
      - name: Warm the clippy profile (not sccache-cacheable; rust-cache only)
        if: matrix.profile == 'clippy' && steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --all-targets --locked --features test-seam -- -D warnings
      - name: sccache statistics
        if: ${{ !cancelled() }}
        run: sh $GITHUB_WORKSPACE/scripts/ci-sccache stats

  # CAD-1551: warm both cross-build dependency profiles on merged code only.
  # The test profile optimizes dependencies differently from dev, so test
  # artifacts alone do not warm the gate's default production-feature build.
  # Bump the shared epoch in producer and consumer when warm inputs change:
  # an existing immutable cache entry would otherwise skip the new work.
  cache-warm-cross:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux
            runner: ubuntu-22.04-arm
          - target: aarch64-macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: scripts/ci-rust-toolchain --profile minimal
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cross-dual2-${{ matrix.target }}
      - name: Warm the cross-build test and dev profiles
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CARGO_BUILD_JOBS: 4
        run: |
          # CAD-1970: the CAD-1425 acceptance target was retired with the test
          # reset; the dev-profile build is what the cross gates now restore.
          cargo build --locked

  # CAD-1131: build the release binary once per git TREE. A queue entry's
  # merge_group run builds the shipping binary in parallel with the gates
  # (`contents: read` only, like release-artifact; not a required check) and
  # uploads it as `release-tree-<tree>`. The main push for that same sha
  # reuses it through `release-reuse` instead of compiling again. No
  # `overwrite`, so a later step of this run cannot replace the artifact.
  release-queue-build:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Refuse reduced-gate release artifact before building
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: scripts/require-full-gates "$GITHUB_WORKSPACE" "$SOURCE_SHA"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: scripts/ci-rust-toolchain --profile minimal
      # Restore-only, from the key `cache-warm` (release-full) saves on main.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: gate-release-full
          save-if: false
      - run: bun install --frozen-lockfile
        working-directory: ui
      - run: bun run build
        working-directory: ui
      - run: cargo build --release --locked --features ui
      - name: Pack the binary with its tree-hash manifest
        id: pack
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/release-reuse.py pack --binary target/release/cadence \
            --sha "$SOURCE_SHA" --dest dist --run-id "$RUN_ID" \
            --rustc "$(rustc --version)" --cargo "$(cargo --version)"
          echo "tree=$(jq -r .tree dist/manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tree-${{ steps.pack.outputs.tree }}
          path: |
            dist/cadence
            dist/cadence.sha256
            dist/manifest.json
          if-no-files-found: error
          retention-days: 2

  # CAD-1131: reuse the queue run's build when, and only when, every check
  # in scripts/release-reuse.py passes for this checkout's own tree hash
  # (artifact named and manifested by tree, same commit, digest, shape).
  # Any failure leaves `reused` unset and release-artifact rebuilds. It
  # runs no repo build code and never executes the downloaded binary.
  release-reuse:
    needs: [queue-evidence]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.queue-evidence.outputs.tested == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      reused: ${{ steps.done.outputs.reused }}
      sha256: ${{ steps.reuse.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Refuse reduced-gate release artifact before reusing
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: scripts/require-full-gates "$GITHUB_WORKSPACE" "$SOURCE_SHA"
      - name: Fetch and verify the queue run's build of this tree
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          QUEUE_RUN_ID: ${{ needs.queue-evidence.outputs.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -uo pipefail
          if python3 scripts/release-reuse.py reuse --repo "$REPO" --sha "$SOURCE_SHA" \
              --queue-run-id "$QUEUE_RUN_ID" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
              --dest dist; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
            echo "release reused from merge_group run $QUEUE_RUN_ID (tree verified)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::release reuse refused; release-artifact rebuilds"
            echo "release rebuilt: reuse refused for $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: ${{ steps.reuse.outputs.verified == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-${{ github.sha }}
          path: |
            dist/cadence
            dist/cadence.sha256
            dist/manifest.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      # Only after the upload: a failed upload leaves `reused` unset, so
      # release-artifact rebuilds instead of leaving no release at all.
      - name: Mark the reuse complete
        id: done
        if: ${{ steps.reuse.outputs.verified == 'true' }}
        run: echo "reused=true" >> "$GITHUB_OUTPUT"

  # CAD-334: keep the exact tested main build. Runs only on a push to main
  # (never pull_request or merge_group), and only when every gate passed
  # on this same sha: either in this run (a direct push, or no queue
  # evidence), or in the merge_group run queue-evidence found (CAD-409),
  # whose gates are then skipped here. manifest.json records which run
  # holds the checks (`checks_event`, `checks_run_id`), so its `checks`
  # list stays true.
  # The `if` spells out the needs' results: skipped gates would otherwise
  # skip this job, because a job's default success() check fails when a
  # job it needs was skipped.
  # Two jobs, so third-party build code (cargo build scripts, Bun
  # packages) never runs with `id-token: write`:
  # - release-artifact builds with `contents: read` only and uploads the
  #   dist as an intermediate artifact;
  # - release-attest runs no repo code: it downloads that dist, re-checks
  #   its sha256 and manifest, attests the binary, and uploads the final
  #   `cadence-<sha>-x86_64-linux` that `cadence upgrade` installs.
  # The toolchain is the same floating `stable` the test jobs use, so the
  # release build matches what was tested; the exact rustc/cargo versions
  # are recorded in manifest.json. Neither job is a required check.
  release-artifact:
    needs: [queue-evidence, release-reuse, fmt, clippy, build, ui]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.release-reuse.outputs.reused != 'true' &&
      (needs.queue-evidence.outputs.tested == 'true' ||
      (needs.fmt.result == 'success' && needs.clippy.result == 'success' &&
      needs.build.result == 'success' &&
      needs.ui.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    # CAD-379: the digest of the bytes this job built, handed to
    # release-attest outside the artifact so a swapped artifact cannot
    # vouch for itself.
    outputs:
      sha256: ${{ steps.assemble.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Refuse reduced-gate release artifact before building
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: scripts/require-full-gates "$GITHUB_WORKSPACE" "$SOURCE_SHA"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: scripts/ci-rust-toolchain --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: bun install --frozen-lockfile
        working-directory: ui
      - run: bun run build
        working-directory: ui
      - run: cargo build --release --locked --features ui
      - name: Assemble binary, sha256 and manifest
        id: assemble
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          QUEUE_TESTED: ${{ needs.queue-evidence.outputs.tested }}
          QUEUE_RUN_ID: ${{ needs.queue-evidence.outputs.run_id }}
        run: |
          set -euo pipefail
          # Which run's gates vouch for `checks` (CAD-409).
          if [ "$QUEUE_TESTED" = true ]; then
            checks_event=merge_group checks_run_id=$QUEUE_RUN_ID
          else
            checks_event=push checks_run_id=$RUN_ID
          fi
          mkdir -p dist
          cp target/release/cadence dist/cadence
          chmod 0755 dist/cadence
          # The binary must report the commit it was built from.
          version=$(dist/cadence --version)
          case "$version" in
            *"+$SOURCE_SHA") ;;
            *) echo "binary reports '$version', expected +$SOURCE_SHA" >&2; exit 1 ;;
          esac
          (cd dist && sha256sum cadence > cadence.sha256)
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --argjson run_id "$RUN_ID" \
            --argjson run_attempt "$RUN_ATTEMPT" \
            --arg rustc "$(rustc --version)" \
            --arg cargo "$(cargo --version)" \
            --arg sha256 "$(cut -d' ' -f1 dist/cadence.sha256)" \
            --arg checks_event "$checks_event" \
            --argjson checks_run_id "$checks_run_id" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{source_sha: $source_sha, run_id: $run_id, run_attempt: $run_attempt,
              rustc: $rustc, cargo: $cargo, features: ["ui"],
              target: "x86_64-linux", runner: "ubuntu-24.04",
              checks: ["fmt", "clippy", "build", "ui"],
              checks_event: $checks_event, checks_run_id: $checks_run_id,
              sha256: $sha256, built_at: $built_at}' > dist/manifest.json
          cat dist/manifest.json dist/cadence.sha256
          echo "sha256=$(cut -d' ' -f1 dist/cadence.sha256)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-${{ github.sha }}
          path: |
            dist/cadence
            dist/cadence.sha256
            dist/manifest.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  release-attest:
    needs: [release-artifact, release-reuse]
    # Explicit result check: release-artifact's skipped gate needs (queue
    # evidence found) would fail the default success() here too. Exactly
    # one of release-artifact (built here) or release-reuse (verified from
    # the queue run, CAD-1131) supplies the bytes and their digest.
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.release-artifact.result == 'success' ||
      (needs.release-reuse.result == 'success' && needs.release-reuse.outputs.reused == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-build-${{ github.sha }}
          path: dist
      - name: Re-check sha256 and manifest against the built digest
        working-directory: dist
        env:
          SOURCE_SHA: ${{ github.sha }}
          BUILT_SHA256: ${{ needs.release-reuse.outputs.sha256 || needs.release-artifact.outputs.sha256 }}
        run: |
          set -euo pipefail
          # The downloaded binary must be the bytes release-artifact built,
          # by the digest it passed as a job output (not read from the
          # artifact itself), before anything is attested.
          if ! [[ "$BUILT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "release-artifact passed no sha256 output ('$BUILT_SHA256')" >&2
            exit 1
          fi
          actual=$(sha256sum cadence | cut -d' ' -f1)
          if [ "$actual" != "$BUILT_SHA256" ]; then
            echo "downloaded cadence hashes to $actual, release-artifact built $BUILT_SHA256" >&2
            exit 1
          fi
          sha256sum -c cadence.sha256
          test "$(cut -d' ' -f1 cadence.sha256)" = "$BUILT_SHA256"
          test "$(jq -r .source_sha manifest.json)" = "$SOURCE_SHA"
          test "$(jq -r .sha256 manifest.json)" = "$BUILT_SHA256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/cadence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cadence-${{ github.sha }}-x86_64-linux
          path: |
            dist/cadence
            dist/cadence.sha256
            dist/manifest.json
          if-no-files-found: error
          retention-days: 90
          # A re-run of this job re-attests the same sha in the same run.
          overwrite: true

  # CAD-311: a `v*` tag publishes a GitHub Release that install.sh
  # installs. Same shape as release-artifact/release-attest above: the
  # builds run with `contents: read` only; release-publish runs no repo
  # code (it only reads install.sh) and is the one job that can attest
  # and write the release. Every leg needs all five gates on the tagged
  # commit (queue-evidence reports false for tags, so they always run
  # and release-gate refuses any failed/cancelled/skipped/missing result),
  # and release-gate refuses
  # a tag that is not on main or does not match Cargo.toml's version.
  #
  # Assets, per target (x86_64-linux, aarch64-linux, aarch64-macos):
  #   cadence-<tag>-<target>.tar.gz         cadence, cadence.sha256,
  #                                         manifest.json at the root;
  #                                         the UI is embedded (--features ui)
  #   cadence-<tag>-<target>.tar.gz.sha256  its `sha256sum` line
  # plus scripts/install.sh as `install.sh`. The tarball's three files are the ones `cadence
  # upgrade` keeps in a release dir. Linux builds on 22.04 runners so the
  # binary needs glibc 2.35, not 2.39.
  release-gate:
    if: ${{ always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [fmt, clippy, build, ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Every required upstream gate succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' >> "$GITHUB_STEP_SUMMARY"
          echo "$NEEDS_JSON" | jq -e '. as $needs | ["fmt", "clippy", "build", "ui"] | all(. as $gate | $needs[$gate].result == "success")' >/dev/null || {
            echo "Required upstream gate failed, was cancelled/skipped, or has no result; refusing release" >&2
            exit 1
          }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Refuse reduced-gate tag before release builds
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: scripts/require-full-gates "$GITHUB_WORKSPACE" "$SOURCE_SHA"
      - run: scripts/ci-rust-toolchain --profile minimal
      - name: Tag names this version and is on main
        env:
          TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "tag '$TAG' is not v<version>" >&2; exit 1 ;;
          esac
          case "$TAG" in
            *[!0-9A-Za-z.+_-]*) echo "tag '$TAG' has characters install.sh refuses" >&2; exit 1 ;;
          esac
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "cadence-agent") | .version')
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match Cargo.toml version $version — bump it first" >&2
            exit 1
          fi
          # The same rule `cadence upgrade` applies: only commits on main.
          status=$(gh api "repos/$REPO/compare/$SOURCE_SHA...main" --jq .status)
          case "$status" in
            identical | ahead) ;;
            *) echo "$SOURCE_SHA is not on main (compare: $status)" >&2; exit 1 ;;
          esac

  release-build:
    needs: [release-gate]
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-linux
            runner: ubuntu-22.04
          - target: aarch64-linux
            runner: ubuntu-22.04-arm
          - target: aarch64-macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: scripts/ci-rust-toolchain --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: bun install --frozen-lockfile
        working-directory: ui
      - run: bun run build
        working-directory: ui
      - run: cargo build --release --locked --features ui
      - name: Assemble tarball, sha256 and manifest
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          RUNNER: ${{ matrix.runner }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          # macOS tar would add AppleDouble `._*` entries.
          COPYFILE_DISABLE: 1
        run: |
          set -euo pipefail
          # shasum ships on both Linux and macOS runners; sha256sum does not.
          sha256() { shasum -a 256 "$1" | cut -d' ' -f1; }
          mkdir -p stage dist
          cp target/release/cadence stage/cadence
          chmod 0755 stage/cadence
          # The binary must report this version and commit.
          version=$(stage/cadence --version)
          if [ "$version" != "cadence ${TAG#v}+$SOURCE_SHA" ]; then
            echo "binary reports '$version', expected 'cadence ${TAG#v}+$SOURCE_SHA'" >&2
            exit 1
          fi
          digest=$(sha256 stage/cadence)
          printf '%s  cadence\n' "$digest" > stage/cadence.sha256
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg version "$TAG" \
            --argjson run_id "$RUN_ID" \
            --argjson run_attempt "$RUN_ATTEMPT" \
            --arg rustc "$(rustc --version)" \
            --arg cargo "$(cargo --version)" \
            --arg target "$TARGET" \
            --arg runner "$RUNNER" \
            --arg sha256 "$digest" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{source_sha: $source_sha, version: $version, run_id: $run_id,
              run_attempt: $run_attempt, rustc: $rustc, cargo: $cargo,
              features: ["ui"], target: $target, runner: $runner,
              checks: ["fmt", "clippy", "build", "ui"],
              sha256: $sha256, built_at: $built_at}' > stage/manifest.json
          asset="cadence-$TAG-$TARGET.tar.gz"
          tar -czf "dist/$asset" -C stage cadence cadence.sha256 manifest.json
          (cd dist && printf '%s  %s\n' "$(sha256 "$asset")" "$asset" > "$asset.sha256")
          cat stage/manifest.json "dist/$asset.sha256"
          if [ "$TARGET" = x86_64-linux ]; then
            scripts/package-app-toolchain --cadence target/release/cadence \
              --tag "$TAG" --source-sha "$SOURCE_SHA" --out "$RUNNER_TEMP/app-toolchain-dist"
            cp "$RUNNER_TEMP"/app-toolchain-dist/* dist/
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # CAD-1400: install the exact tag candidate natively on every target
  # before release-publish may run. Each leg reuses clean-install.py's
  # acquire-candidate + harness against THIS run's artifacts: the
  # acquisition classifier (jobs_status) intentionally requires only the
  # five gates, release-gate and the three release-build legs, so these
  # legs may wait for one another's producer artifacts without deadlock
  # (a publisher waiting on the `release` environment approval is also
  # supported). The legs are tag-only effective: they need release-build,
  # which exists only on v* tag runs. The read-only token is confined to
  # the acquisition step; the harness runs without it.
  release-install:
    needs: [release-build]
    name: install-only (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runner: ubuntu-22.04
          - target: aarch64-linux
            runner: ubuntu-22.04-arm
          - target: aarch64-macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    env:
      PACKAGE_TAG: ${{ github.ref_name }}
      PACKAGE_SHA: ${{ github.sha }}
      PACKAGE_RUN: ${{ github.run_id }}
      PACKAGE_ATTEMPT: ${{ github.run_attempt }}
      PACKAGE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Acquire this run's pinned candidate (read-only token here only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/clean-install.py acquire-candidate \
            --tag "$PACKAGE_TAG" --sha "$PACKAGE_SHA" --target "$PACKAGE_TARGET" \
            --run-id "$PACKAGE_RUN" --attempt "$PACKAGE_ATTEMPT" \
            --out "$RUNNER_TEMP/package"
      - name: Install, version, custom prefix and stable reruns (no acquisition token)
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, pathlib, shutil, subprocess, sys
          spec = importlib.util.spec_from_file_location('smoke', 'scripts/clean-install.py')
          smoke = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(smoke)
          env = os.environ
          package = pathlib.Path(env['RUNNER_TEMP']) / 'package'
          evidence = pathlib.Path(env['RUNNER_TEMP']) / 'clean-install-evidence'
          evidence.mkdir()
          manifest = json.loads((package / 'manifest.json').read_text())
          smoke.check_manifest(manifest, env['PACKAGE_TAG'], env['PACKAGE_SHA'], env['PACKAGE_TARGET'],
                               int(env['PACKAGE_RUN']), int(env['PACKAGE_ATTEMPT']))
          for name in ('receipt.json', 'manifest.json', 'wait.json'):
              if (package / name).exists():
                  shutil.copyfile(package / name, evidence / name)
          (evidence / 'producer.json').write_text(json.dumps({
              'workflow_source_sha': env['GITHUB_SHA'], 'workflow_run_id': env['GITHUB_RUN_ID'],
              'workflow_run_attempt': env['GITHUB_RUN_ATTEMPT'], 'mode': 'candidate',
              'tag': env['PACKAGE_TAG'], 'package_source_sha': env['PACKAGE_SHA'],
              'package_run_id': int(env['PACKAGE_RUN']), 'package_run_attempt': int(env['PACKAGE_ATTEMPT']),
              'target': env['PACKAGE_TARGET'], 'full_cad317_acceptance': False}, indent=2) + '\n')
          argv = [sys.executable, 'scripts/clean-install.py', 'harness',
                  '--installer', str(package / 'install.sh'), '--tag', env['PACKAGE_TAG'],
                  '--sha', env['PACKAGE_SHA'], '--target', env['PACKAGE_TARGET'],
                  '--expect-sha256', manifest['sha256'], '--mode', 'candidate',
                  '--expected-manifest', str(package / 'manifest.json'),
                  '--out', str(evidence / 'harness.json')]
          mirror = pathlib.Path(env['RUNNER_TEMP']) / 'candidate-mirror'
          version = mirror / env['PACKAGE_TAG']
          version.mkdir(parents=True)
          asset = 'cadence-' + env['PACKAGE_TAG'] + '-' + env['PACKAGE_TARGET'] + '.tar.gz'
          for name in (asset, asset + '.sha256'):
              shutil.copyfile(package / name, version / name)
          argv += ['--base-url', mirror.as_uri()]
          # Application environment is independently rebuilt by the harness;
          # it cannot inherit this controller's credentials or toolchain PATH.
          result = subprocess.run(argv, text=True, capture_output=True)
          (evidence / 'harness.stdout').write_text(result.stdout)
          (evidence / 'harness.stderr').write_text(result.stderr)
          (evidence / 'harness.rc').write_text(str(result.returncode) + '\n')
          sys.exit(result.returncode)
          PY
      - name: Preserve small receipts, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clean-install-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/clean-install-evidence/
            ${{ runner.temp }}/package/receipt.json
            ${{ runner.temp }}/package/wait.json
          if-no-files-found: warn
          retention-days: 14

  release-publish:
    needs: [release-build, release-install]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A `v*` tag runs the ci.yml OF THE TAGGED COMMIT, so a tag on an
    # unmerged commit could drop release-gate. Repo settings close that:
    # the `release` environment needs a reviewer and admits only `v*`
    # tags, the "release tags" ruleset (23893821) makes v* tags admin-only,
    # and releases are immutable once published. Consumers verify the
    # attestation's --source-ref and --signer-workflow (INSTALL-AGENT.md).
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # install.sh is published as a release asset; ui/package.json and
      # ui/app-kit are read only as pin data. No repository code runs in this
      # privileged job; the guard hashes the vendored receiver bytes.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            scripts/install.sh
            ui/package.json
            ui/app-kit/
          sparse-checkout-cone-mode: false
          path: src
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-${{ github.ref_name }}-*
          path: dist
          merge-multiple: true
      - name: Re-check every tarball's sha256 and contents
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for target in x86_64-linux aarch64-linux aarch64-macos; do
            asset="cadence-$TAG-$target.tar.gz"
            sha256sum -c "$asset.sha256"
            listing=$(tar -tzf "$asset" | sort | tr '\n' ' ')
            test "$listing" = "cadence cadence.sha256 manifest.json "
          done
          asset="cadence-app-toolchain-$TAG.tar.gz"
          sha256sum -c "$asset.sha256"
          python3 - "$asset" "$TAG" "$SOURCE_SHA" ../src/ui/package.json <<'PY'
          import hashlib, json, re, sys, tarfile
          from pathlib import Path
          archive, tag, source_sha, ui_manifest_path = sys.argv[1:]
          app_kit_files = ("README.md", "package.json", "src/index.mjs", "src/receiver.mjs",
                           "src/refusal.mjs", "types/index.d.ts")
          expected = {
              "LICENSE", "README.md", "frame-kit/frame.html", "frame-kit/kit.css",
              "frame-kit/metadata.json", "package.json", "bun.lock", "toolchain.json",
              *(f"app-kit/{relative}" for relative in app_kit_files),
          }
          if not re.fullmatch(r"v[0-9][0-9A-Za-z.+_-]*", tag) or not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise SystemExit("invalid release tag or source commit")
          with tarfile.open(archive, "r:gz") as tar:
              entries = tar.getmembers()
              names = [entry.name for entry in entries]
              if set(names) != expected or len(names) != len(expected) or any(not entry.isfile() for entry in entries):
                  raise SystemExit("app-toolchain archive has an unexpected member list or file type")
              if any(entry.size > 8 * 1024 * 1024 for entry in entries) or sum(entry.size for entry in entries) > 16 * 1024 * 1024:
                  raise SystemExit("app-toolchain archive exceeds the size limit")
              def read_json(name):
                  return json.load(tar.extractfile(name))
              metadata = read_json("toolchain.json")
              package = read_json("package.json")
              archived_app_kit = {
                  relative: tar.extractfile(f"app-kit/{relative}").read()
                  for relative in app_kit_files
              }
          ui = json.load(open(ui_manifest_path, encoding="utf-8"))
          ui_pins = {**ui["dependencies"], **ui["devDependencies"]}
          pin_names = ("react", "react-dom", "vite", "@vitejs/plugin-react")
          pins = {name: ui_pins.get(name) for name in pin_names}
          app_kit_dir = Path(ui_manifest_path).parent / "app-kit"
          app_kit_hashes = {
              relative: hashlib.sha256((app_kit_dir / relative).read_bytes()).hexdigest()
              for relative in app_kit_files
          }
          for relative in app_kit_files:
              if archived_app_kit[relative] != (app_kit_dir / relative).read_bytes():
                  raise SystemExit(f"app-kit archive bytes differ from source: {relative}")
          app_kit_version = json.loads((app_kit_dir / "package.json").read_text())["version"]
          manager = ui.get("packageManager")
          if not isinstance(manager, str) or not re.fullmatch(r"bun@[0-9]+(?:\.[0-9]+){2}", manager):
              raise SystemExit("UI package manager must be an exact bun major.minor.patch version")
          if metadata != {"schema": "cadence-app-toolchain/1", "tag": tag,
                          "source_sha": source_sha, "package_manager": manager, "pins": pins,
                          "app_kit": {"version": app_kit_version, "files": app_kit_hashes}}:
              raise SystemExit("app-toolchain version, source, schema, package manager, pins or app-kit do not match")
          expected_package = {
              "name": "cadence-app-toolchain", "private": True,
              "version": tag[1:], "type": "module", "packageManager": manager,
              "scripts": {"dev": "vite", "build": "vite build"},
              "dependencies": {name: pins[name] for name in pin_names[:2]},
              "devDependencies": {name: pins[name] for name in pin_names[2:]},
          }
          if package != expected_package:
              raise SystemExit("app-toolchain package manifest differs from the fixed source-derived manifest")
          PY
          cp ../src/scripts/install.sh install.sh
          ls -l
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/install.sh
      # Published bytes never change under a tag (and immutable releases
      # refuse uploads once published). A new release is created as a
      # draft with every asset, then published last. A draft left by a
      # failed run was never public, so its assets may be replaced. For a
      # published release nothing is uploaded: its assets must be
      # byte-identical to this run's (a no-op re-run), or the job fails.
      - name: Publish the GitHub Release
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=(./*.tar.gz ./*.sha256 install.sh)
          # Classify from the prerelease portion of the exact Cargo tag;
          # a hyphen in build metadata alone is not a prerelease.
          prerelease=false
          latest=true
          case "${TAG%%+*}" in *-*) prerelease=true; latest=false ;; esac
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = true ]; then
              gh release upload "$TAG" --clobber "${assets[@]}"
              gh release edit "$TAG" --draft=false --prerelease="$prerelease" --latest="$latest"
              exit 0
            fi
            # A published release is read-only, including its classification.
            # Do not repair an incorrect pilot by mutating published metadata.
            published_pre=$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)
            if [ "$published_pre" != "$prerelease" ]; then
              echo "release $TAG is already published with a different prerelease classification" >&2
              exit 1
            fi
            mkdir ../published
            gh release download "$TAG" --dir ../published
            (cd ../published && find . -maxdepth 1 -type f -printf '%f\n' | sort) > ../published.list
            printf '%s\n' "${assets[@]#./}" | sort > ../ours.list
            if ! diff ../ours.list ../published.list; then
              echo "release $TAG is already published with a different asset list" >&2
              exit 1
            fi
            for f in "${assets[@]#./}"; do
              if ! cmp -s "$f" "../published/$f"; then
                echo "release $TAG is already published and $f differs — refusing to replace it" >&2
                exit 1
              fi
            done
            echo "release $TAG is already published with identical assets"
            exit 0
          fi
          gh release create "$TAG" --draft --verify-tag --title "cadence $TAG" \
            --generate-notes --prerelease="$prerelease" --latest="$latest" "${assets[@]}"
          gh release edit "$TAG" --draft=false --prerelease="$prerelease" --latest="$latest"
      # CAD-1455: retain the published public-client attestation bundles
      # offline-verifiably so the owned release source can carry the same
      # `ci.yml` proof the live `gh attestation verify` checks. Each
      # per-target tarball's bundle is downloaded after the release
      # published — the signatures cover the exact published bytes.
      - name: Retain the published build-provenance bundles
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p bundles
          for target in x86_64-linux aarch64-linux aarch64-macos; do
            asset="cadence-$TAG-$target.tar.gz"
            (cd "$RUNNER_TEMP" && gh attestation download "$OLDPWD/$asset" \
              --repo "$GH_REPO" --digest-alg sha256)
            mv "$RUNNER_TEMP"/sha256:*.jsonl "bundles/build-attestation-$target.jsonl"
          done
          ls -l bundles
      # CAD-1455: the post-publication receipt. A build-provenance
      # bundle attests the archive BEFORE `Publish the GitHub Release`
      # ran — even a failed or unpublished release carries that proof.
      # This receipt is minted only after that step has made the real
      # release public: it re-proves the release is non-draft with the
      # exact tag, binds the repository, the genuine publishedAt (read
      # back, never the run's clock), this run's source commit and the
      # sha256 of every published per-target archive, and is attested
      # by this job's ci.yml@tag identity. The owned release source's
      # public-client path verifies it offline; without it the
      # catalogue's build bundle alone cannot prove publication.
      - name: Mint and attest the post-publication receipt
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release=$(gh release view "$TAG" --repo "$GH_REPO" \
            --json isDraft,tagName,publishedAt,assets)
          echo "$release" | jq -e --arg tag "$TAG" '
            .isDraft == false and .tagName == $tag' >/dev/null
          published_at=$(echo "$release" | jq -r '.publishedAt // empty')
          # The receipt binds the sha256 of every published
          # per-target archive; the published asset list must name the
          # exact same asset names, so a missing or extra published
          # asset refuses here.
          echo "$release" | jq -r '.assets[].name' | sort > /tmp/published-assets
          archives=$(for target in x86_64-linux aarch64-linux aarch64-macos; do
            asset="cadence-$TAG-$target.tar.gz"
            jq -n --arg name "$asset" --arg digest "sha256:$(sha256sum "$asset" | cut -d' ' -f1)" \
              '{key: $name, value: $digest}'
          done | jq -s 'from_entries')
          for asset in $(echo "$archives" | jq -r 'keys[]'); do
            grep -qx "$asset" /tmp/published-assets
            grep -qx "$asset.sha256" /tmp/published-assets
          done
          jq -n \
            --argjson schema 1 \
            --arg repo "$GH_REPO" \
            --arg tag "$TAG" \
            --arg source "$SOURCE_SHA" \
            --argjson archives "$archives" \
            --arg published_at "$published_at" '
            {schema: $schema, repo: $repo, tag: $tag, source_sha: $source,
             archives: $archives,
             published_at: (if $published_at == "" then null else $published_at end)}' \
            > publication-receipt.json
          cat publication-receipt.json >> "$GITHUB_STEP_SUMMARY"
      - name: Attest the post-publication receipt
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/publication-receipt.json
      - name: Retain the post-publication bundle
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP" && gh attestation download "$OLDPWD/publication-receipt.json" \
            --repo "$GH_REPO" --digest-alg sha256)
          mv "$RUNNER_TEMP"/sha256:*.jsonl bundles/publication-attestation.jsonl
          ls -l publication-receipt.json bundles/publication-attestation.jsonl
      # Upload the receipt and its bundle inside the same
      # release-bundles artifact (byte-exact for the R2 publisher).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundles-${{ github.ref_name }}
          path: |
            dist/bundles/
            dist/publication-receipt.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  # CAD-1455/CAD-1479: publish the public-client release into the owned
  # R2 release namespace after the GitHub Release above is published.
  # `needs: release-publish` is the gate: that job already runs only
  # after a human approves its protected `release` environment, so this
  # job never runs for an unapproved or unpublished release. Runs only
  # when the operator provisioned the endpoint/bucket/credentials as
  # vars/secrets and they equal the dedicated release store literals —
  # an absent or foreign configuration is an honest skip, never a
  # guessed bucket. Objects are copied byte-exact and written
  # conditionally; the catalogue record is written last. Visibility is
  # `public` because the release approval already made these exact
  # bytes public; operator-host records stay private by default under
  # promotion-completion.yml's own separate gates.
  release-publish-r2:
    needs: [release-publish]
    if: >
      vars.RELEASES_R2_ENDPOINT == 'https://87b59a40e130c425e35474687ad98a4f.r2.cloudflarestorage.com' &&
      vars.RELEASES_R2_BUCKET == 'agenticos-v2-release-artifacts'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # CAD-1506: the release-store write credentials live in the
    # `release-store` environment (branch policy: main and v* tags), not
    # at repository scope. A repository secret is readable by any run from
    # a branch of this repo, including a PR run of the PR's own code; the
    # environment's branch policy keeps the key off PR refs. The
    # environment has no required reviewers, so this adds no approval
    # click: `release-publish` above stays the only gate on a tag.
    environment: release-store
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-${{ github.ref_name }}-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-bundles-${{ github.ref_name }}
          path: dist/bundles
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: |
            scripts/publish-release.py
          sparse-checkout-cone-mode: false
          path: src
          persist-credentials: false
      - name: Publish the public-client release
        env:
          TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          # Operator-provisioned R2 access keys, supplied as repository
          # secrets — no local AWS profile is created (a hosted runner
          # has none) and no credential value is ever an argument or
          # printed. publish-release.py fails closed when the
          # configured job lacks them.
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASES_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY"
          # upload-artifact keeps the bundles/ directory name. Extracting
          # that archive into dist/bundles nests the attestations one
          # level deeper. The receipt is uploaded beside that directory,
          # so it is already in dist/bundles/.
          if [ -f dist/bundles/bundles/build-attestation-x86_64-linux.jsonl ]; then
            mv dist/bundles/bundles/*.jsonl dist/bundles/
          fi
          args=()
          for target in x86_64-linux aarch64-linux aarch64-macos; do
            asset="cadence-$TAG-$target.tar.gz"
            args+=(--artifact "$asset=dist/$asset:$target:application/octet-stream")
            args+=(--artifact "$asset.sha256=dist/$asset.sha256:$target:text/plain")
            args+=(--artifact "build-attestation-$target.jsonl=dist/bundles/build-attestation-$target.jsonl:$target:application/json")
          done
          args+=(--artifact "publication-receipt.json=dist/bundles/publication-receipt.json:publication:application/json")
          args+=(--artifact "publication-attestation.jsonl=dist/bundles/publication-attestation.jsonl:publication:application/json")
          # publishedAt is the release's genuine stamp, not this
          # mirror run's clock; an idempotent retry passes the same
          # first-recorded value.
          published_at=$(GH_TOKEN="${{ github.token }}" gh release view "$TAG" \
            --repo favcrm/cadence \
            --json publishedAt --jq '.publishedAt // empty' 2>/dev/null || true)
          extra=()
          test -n "$published_at" && extra=(--published-at "$published_at")
          python3 src/scripts/publish-release.py \
            --endpoint "https://87b59a40e130c425e35474687ad98a4f.r2.cloudflarestorage.com" \
            --bucket "agenticos-v2-release-artifacts" \
            --product cadence --profile public-client \
            --version "$TAG" --source-sha "$SOURCE_SHA" \
            --visibility public \
            "${extra[@]}" \
            "${args[@]}"

  # CAD-311: prove the non-x86_64 builds on every PR and queue entry, not
  # first at a tag. macOS also builds the UI to catch case-insensitive
  # module resolution failures before release. Rust builds remain unembedded.
  # macOS minutes are free for this public repo.
  cross-build:
    needs: [change-scope]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && (needs.change-scope.outputs.rust != 'false' || needs.change-scope.outputs.ui != 'false') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux
            runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - target: aarch64-macos
            runner: macos-15
            rust_target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ matrix.target == 'aarch64-macos' && needs.change-scope.outputs.cross != 'false' }}
        with:
          bun-version-file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ matrix.target == 'aarch64-macos' && needs.change-scope.outputs.cross != 'false' }}
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
        if: ${{ matrix.target == 'aarch64-macos' && needs.change-scope.outputs.cross != 'false' }}
        working-directory: ui
      - run: bun run build
        if: ${{ matrix.target == 'aarch64-macos' && needs.change-scope.outputs.cross != 'false' }}
        working-directory: ui
      - run: scripts/ci-rust-toolchain --profile minimal
      - run: rustup target add ${{ matrix.rust_target }}
        if: ${{ needs.change-scope.outputs.cross != 'false' && github.event_name == 'pull_request' }}
      # Restore-only cache with both test-seam/test and default/dev dependencies.
      # Keep the epoch aligned with cache-warm-cross; only main saves it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ needs.change-scope.outputs.cross != 'false' }}
        with:
          shared-key: cross-dual2-${{ matrix.target }}
          save-if: false
      # The acceptance links CARGO_BIN_EXE_cadence, so `cargo test` builds
      # the binary too; run it first and let `cargo build` verify the
      # production feature shape afterward.
      # CAD-1425: the client-update refusal acceptance runs on each native
      # leg; the cfg(macos) test is the real Apple Silicon outcome.
      - run: cargo check --locked --target ${{ matrix.rust_target }}
        if: ${{ needs.change-scope.outputs.cross != 'false' && github.event_name == 'pull_request' }}
      - run: cargo build --locked
        if: ${{ needs.change-scope.outputs.cross != 'false' && github.event_name != 'pull_request' }}
      - run: target/debug/cadence --version
        if: ${{ needs.change-scope.outputs.cross != 'false' && github.event_name != 'pull_request' }}

  # CAD-1540: `cross-build` cannot be a required check itself — `change-scope`
  # skips it on docs-only changes, and a skipped or absent context blocks merges
  # instead of guarding them. This job always runs and reports the matrix's real
  # outcome, so its check name is the one to require. Operator step, after this
  # merges: add `cross-build (required)` to the required status checks.
  cross-build-required:
    name: cross-build (required)
    needs: [cross-build]
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: instabox-medium
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Gate on the cross-build matrix result
        env:
          CROSS_BUILD_RESULT: ${{ needs.cross-build.result }}
        run: scripts/cross-build-gate.sh

  # CAD-109 backstop: gitleaks, an implementation independent of cadence's
  # in-process scanner, runs over the PR's own commits (base..head) with its
  # built-in rule pack, which is the same release cadence vendors. The binary
  # is pinned by version and sha256 (scripts/install-gitleaks), and --redact
  # keeps any finding's value out of the log. PR bodies are not scanned in
  # this phase.
  secrets:
    if: github.event_name == 'pull_request'
    runs-on: instabox-medium
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks 8.30.1
        env:
          CADENCE_GITLEAKS_INSTALL_DIR: ${{ runner.temp }}/gitleaks-8.30.1
          TMPDIR: ${{ runner.temp }}
        run: scripts/install-gitleaks
      - name: Scan the PR's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks-8.30.1/gitleaks" git --no-banner --redact --verbose \
            --log-opts="$BASE_SHA..$HEAD_SHA" .

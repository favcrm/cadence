# cadence-review.toml — the steps `cadence review <PR>` runs, as data.
# Required keys: prepare, gates, full_suite, test_globs, test_command,
# stress_pattern. Optional: [timeouts] *_secs overrides.
#
# Every command below runs like GitHub CI, with no git identity (CAD-301,
# CAD-307). Set: HOME (a scratch dir, mode 0700, deleted afterwards),
# GIT_CONFIG_NOSYSTEM=1, user.useConfigOnly=true (appended through
# GIT_CONFIG_COUNT/GIT_CONFIG_KEY_<n>/GIT_CONFIG_VALUE_<n>; the caller's
# own entries are kept except identity keys), and CARGO_HOME, RUSTUP_HOME
# and XDG_DATA_HOME at their real locations (from the real home when
# unset). Unset: EMAIL, GIT_AUTHOR_NAME, GIT_AUTHOR_EMAIL,
# GIT_COMMITTER_NAME, GIT_COMMITTER_EMAIL, GIT_CONFIG_PARAMETERS,
# GIT_CONFIG_GLOBAL, GIT_CONFIG_SYSTEM and XDG_CONFIG_HOME.
# A test or tool that commits must pass `-c user.name=… -c user.email=…`
# (see gate_env in src/review.rs).

# Run once in the review checkout before gating. The UI clippy gate needs
# the UI built (the `ui` cargo feature embeds ui/dist); node_modules is
# linked from the main checkout so pnpm build reuses its store.
prepare = [
    "cd ui && ln -sfn ../../../../ui/node_modules node_modules",
    "cd ui && node_modules/.bin/vite build",
]

# Ordered gates — the first failure stops the sequence and its last 40
# output lines land in the report. vite build strips TypeScript types
# without checking them, so the UI type check is its own gate (CAD-264).
# Lint default and test-seam separately, matching CI's supported shapes;
# retain UI lint coverage after prepare builds the embedded assets.
# The board selection preserves all twelve CAD-537 splits of tests/board.rs.
gates = [
    "python3 scripts/check-review-recipe",
    "python3 scripts/test-review-recipe",
    "cargo fmt --all -- --check",
    "cd ui && node_modules/.bin/tsc --noEmit",
    "cd ui && pnpm test",
    "cargo clippy --all-targets --locked -- -D warnings",
    "cargo clippy --all-targets --locked --features test-seam -- -D warnings",
    "cargo clippy --all-targets --locked --features ui -- -D warnings",
    "cargo test --locked --test test_seam -- --test-threads 2",
    "cargo test --locked --features test-seam --lib --bins --test board_issue --test board_lanes --test board_sync --test board_http --test board_ui_daemon --test board_tailnet --test board_memory --test board_overview --test board_retro --test board_context --test board_sessions --test board_sign_in -- --test-threads 2",
]

# The one full-suite run (about 12 minutes; skipped with --no-full).
# It runs inside the host-wide slot (CADENCE_SUITE_LOCK, required unless
# --no-suite-lock); the suite binary sees the variable empty so it does
# not queue behind its own parent. Worst case is two full_secs: up to
# full_secs waiting for the slot, then up to full_secs for the run.
# Since CAD-426 the former `integration` binary is split into per-area
# tests/*.rs binaries, so the full suite is the --all-targets group.
# Like CI, runtime suites use test-seam; default-feature clippy also checks
# the production code shape. E2E stays opt-in via its separate workflow.
full_suite = "scripts/cadence-nextest --all-targets --features test-seam"

# Diff paths that count as test files — `fn` items added under these
# are the PR's new tests.
test_globs = ["tests/**"]

# How one test runs alone — {test} = fn name, {file} = diff path,
# {target} = file stem (cargo's --test <stem>). Substitutions arrive
# single-quoted — do not quote them again here.
test_command = "scripts/cadence-nextest --features test-seam --test {target} -- {test} --exact"

# The "waits on daemon state" heuristic: a new test whose name or added
# body contains any of these is stressed `--stress` times (default 5).
stress_pattern = [
    "wait_agent",
    "wait_message",
    "wait_health",
    "wait_daemon",
    "wait_until",
    "deadline",
    "thread::sleep",
    "poll",
]

[timeouts]
prepare_secs = 900
gate_secs = 1800
stress_secs = 900
full_secs = 3600
test_secs = 900
git_secs = 300
gh_secs = 60

# Activation follow-up: full-suite and isolated reruns use the same pinned
# nextest backend. The review parses this profile's JUnit report; a missing
# or empty report is a blocked result rather than a pass.
[runner]
backend = "nextest"
result_format = "junit"
result_path = "target/nextest/cadence/junit.xml"

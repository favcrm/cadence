# cadence-review.toml — the steps `cadence review <PR>` runs, as data.
# Required keys: prepare, gates, full_suite, test_globs, test_command,
# stress_pattern. Optional: [timeouts] *_secs overrides.
#
# Every command below runs like GitHub CI, with no git identity (CAD-301):
# HOME is a scratch dir the review deletes afterwards, GIT_CONFIG_NOSYSTEM=1,
# user.useConfigOnly=true, and EMAIL/GIT_AUTHOR_*/GIT_COMMITTER_* unset.
# CARGO_HOME, RUSTUP_HOME and XDG_DATA_HOME keep their real locations.
# A test or tool that commits must pass `-c user.name=… -c user.email=…`
# (see gate_env in src/review.rs).

# Run once in the review checkout before gating. The clippy gate needs
# the UI built (the `ui` cargo feature embeds ui/dist); node_modules is
# linked from the main checkout so pnpm build reuses its store.
prepare = [
    "cd ui && ln -sfn ../../../../ui/node_modules node_modules",
    "cd ui && node_modules/.bin/vite build",
]

# Ordered gates — the first failure stops the sequence and its last 40
# output lines land in the report.
gates = [
    "cargo fmt --all -- --check",
    "cargo clippy --all-targets --all-features -- -D warnings",
    "cargo test --lib --bins --test board",
]

# The one full-suite run (about 12 minutes; skipped with --no-full).
# It runs inside the host-wide slot (CADENCE_SUITE_LOCK, required unless
# --no-suite-lock); the suite binary sees the variable empty so it does
# not queue behind its own parent. Worst case is two full_secs: up to
# full_secs waiting for the slot, then up to full_secs for the run.
full_suite = "scripts/cadence-nextest --test integration"

# Diff paths that count as test files — `fn` items added under these
# are the PR's new tests.
test_globs = ["tests/**"]

# How one test runs alone — {test} = fn name, {file} = diff path,
# {target} = file stem (cargo's --test <stem>). Substitutions arrive
# single-quoted — do not quote them again here.
test_command = "scripts/cadence-nextest --test {target} -- {test} --exact"

# The "waits on daemon state" heuristic: a new test whose name or added
# body contains any of these is stressed `--stress` times (default 5).
stress_pattern = [
    "wait_agent",
    "wait_message",
    "wait_health",
    "wait_daemon",
    "wait_until",
    "deadline",
    "thread::sleep",
    "poll",
]

[timeouts]
prepare_secs = 900
gate_secs = 1800
stress_secs = 900
full_secs = 3600
test_secs = 900
git_secs = 300
gh_secs = 60

# Activation follow-up: full-suite and isolated reruns use the same pinned
# nextest backend. The review parses this profile's JUnit report; a missing
# or empty report is a blocked result rather than a pass.
[runner]
backend = "nextest"
result_format = "junit"
result_path = "target/nextest/cadence/junit.xml"

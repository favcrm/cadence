[package]
name = "cadence-ui"
version = "0.2.5"
edition = "2021"
license = "MIT"
publish = false
autobins = false
autotests = false

[features]
ui = ["cadence-agent/ui", "cadence-daemon/ui"]
test-seam = ["cadence-agent/test-seam", "cadence-daemon/test-seam"]
native-fixture-admission = ["cadence-agent/native-fixture-admission", "cadence-daemon/native-fixture-admission"]
cli-runtime-test = ["test-seam", "cadence-agent/cli-runtime-test", "cadence-daemon/cli-runtime-test"]

[dependencies]
cadence-agent = { path = "../.." }
cadence-core = { path = "../cadence-core", features = ["custody-crypto"] }
cadence-daemon = { path = "../cadence-daemon" }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2"
regex = "1"
ring = { version = "0.17", default-features = false }
rusqlite = { version = "0.32", features = ["bundled", "backup", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tempfile = "3"
tiny_http = "0.12"
toml = "0.8"
ureq = { version = "3.4.2", default-features = false, features = ["json", "rustls"] }
uuid = { version = "1", features = ["v4", "v5"] }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-pemfile = { version = "2" }
serde_yaml = "0.9"

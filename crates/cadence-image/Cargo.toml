[package]
name = "cadence-image"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
crc32fast = "=1.5.2"
flate2 = "=1.1.10"
png = "=0.18.1"
libjpeg-turbo-rs = { version = "=0.9.0", default-features = false }
heic-rs = { version = "=0.1.4", default-features = false }

[package]
name = "cadence-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local controller coordinating coding agents across terminals"

[lib]
name = "cadence_agent"
path = "src/lib.rs"

[[bin]]
name = "cadence"
path = "src/main.rs"

[features]
# Embed the built `ui/` SPA into the binary. Requires `pnpm build` inside
# `ui/` first; without the feature `cadence ui run --dist <dir>` serves
# the same files from disk.
ui = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v5"] }
sha2 = "0.10"
libc = "0.2"
signal-hook = "0.3"
tiny_http = "0.12"
# Pure-Rust QR for `ui tailscale status` — no image/svg renderers.
qrcode = { version = "0.14.1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = "0.26"
tempfile = "3"
toml = "0.8"
# CAD-109 secret scan: the vendored gitleaks rule pack is RE2 syntax, which
# the regex crate accepts as-is (no lookarounds or backreferences).
regex = "1"

[dev-dependencies]
shlex = "2.0.1"

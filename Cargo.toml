[package]
name = "cadence-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local controller coordinating coding agents across terminals"

[lib]
name = "cadence_agent"
path = "src/lib.rs"

[[bin]]
name = "cadence"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v5"] }
libc = "0.2"
signal-hook = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

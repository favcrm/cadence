[package]
name = "cadence-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local controller coordinating coding agents across terminals"

[lib]
name = "cadence_agent"
path = "src/lib.rs"

[[bin]]
name = "cadence"
path = "src/main.rs"

# CAD-512 / ADR 0007 §5 L1: the setuid-root drop helper. Self-contained
# (std + libc, no cadence_agent link) so its audit surface stays small;
# T1 installs it root:cadence-launch 4750.
[[bin]]
name = "cadence-agent-exec"
path = "src/bin/cadence-agent-exec/main.rs"

[features]
# Embed the built `ui/` SPA into the binary. Requires `pnpm build` inside
# `ui/` first; without the feature `cadence ui run --dist <dir>` serves
# the same files from disk.
ui = []
# CAD-433: build the MVP journey test (`tests/e2e_mvp.rs`). It needs a
# release built and packed by `scripts/e2e/mvp.sh`, Node and Chrome, so
# it is its own opt-in target — never part of `cargo test` or the PR
# suite; CI runs it nightly and on every `v*` tag.
e2e = []
# CAD-482: the test-only caller-identity seam — fixture daemons and
# boards honor explicit `test_caller` / `X-Cadence-Test-As` assertions
# instead of /proc ancestry, so operator-gated suites run identically
# in an agent pane and in CI. A `compile_error!` in src/test_seam.rs
# keeps it out of every release build (debug_assertions off).
test-seam = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# `backup`: the SQLite online backup API for `cadence backup`/`export` (CAD-314).
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4", "v5"] }
sha2 = "0.10"
libc = "0.2"
# Kernel CSPRNG, portable across linux/macos/*bsd — `libc::getrandom`
# itself does not exist on macOS.
getrandom = "0.3"
signal-hook = "0.3"
tiny_http = "0.12"
# Pure-Rust QR for `ui tailscale status` — no image/svg renderers.
qrcode = { version = "0.14.1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = "0.26"
tempfile = "3"
toml = "0.8"
# CAD-109 secret scan: the vendored gitleaks rule pack is RE2 syntax, which
# the regex crate accepts as-is (no lookarounds or backreferences).
regex = "1"
# CAD-396: redact every turn token/generation from an export in one pass.
aho-corasick = "1"
ureq = { version = "3.4.2", default-features = false, features = ["json", "rustls"] }
# CAD-526: the platform's board-identity assertions are compact Ed25519
# JWSs — `ring` verifies them (the same 0.17.14 rustls already compiles;
# verify-only, so no default features); `base64` decodes the JWS parts and
# JWKS `x` keys (the single 0.23.1 ureq already uses; `alloc` suffices).
ring = { version = "0.17", default-features = false }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }

[[test]]
name = "e2e_mvp"
path = "tests/e2e_mvp.rs"
required-features = ["e2e"]

[dev-dependencies]
jsonschema = { version = "=0.56.0", default-features = false }
shlex = "2.0.1"

# Lanes build privately (CAD-174: a shared target let one lane overwrite
# another's `libcadence_agent` mid-run), so every lane pays for its own
# target dir. Incremental state is half of that — 1.3-2.3G a lane — and
# is only worth it for repeated edit-rebuild cycles of this one crate.
[profile.dev]
incremental = false
# CAD-523: full debuginfo was the main per-build memory cost — cold
# `cargo test --no-run --all-targets` peaked at 4.1 GB summed RSS and a
# 6.2 GB target dir. Line tables keep panic locations and backtrace
# file:line while cutting that to ~3.2 GB and ~3.0 GB.
debug = "line-tables-only"

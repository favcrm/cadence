# CAD-2081: the ONLY paths a workflow-issued review may carry to merge without the
# operator. A PR with any workflow-issued verdict row needs the operator's approval
# unless EVERY changed path matches `paths` below and every change is a plain add
# or modify (mode 100644). The list is EMPTY, so today the operator approves every
# merge and workflow rows only satisfy the two reviews. An empty list is valid, not
# an error. `scripts/enqueue-reviewed` reads this file at the live tip of `main`;
# a missing or unreadable file also means the operator. Turning a path on later is
# one reviewed line and a deliberate decision, made only after reading what the
# path holds: a workflow review can say `risk: auto` and a prompt-injected model can
# write that, so the safe default for a path nobody has classified is the operator.
# It does not widen anything for owner-attested reviews, the size trigger, or a
# verdict whose Risk is not `auto`.
#
# Whatever `paths` says, the script never treats as eligible a path with a segment
# starting with `.` (.github, .claude, .gitattributes) or a basename starting
# `agents.`, `claude.` or `gemini.` in any directory (they can load as agent
# instructions), and a modify must keep mode 100644.
#
# Changing this file is class `human` (risk-classes.md trigger 7).

[auto]
paths = []

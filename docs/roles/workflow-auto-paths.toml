# CAD-2081: the ONLY paths a workflow-issued review may carry to merge without the
# operator. A PR with any workflow-issued verdict row needs the operator's approval
# unless EVERY changed path matches `paths` below and every change is a plain add
# or modify of a regular file (a delete, rename, symlink, executable or mode change
# needs the operator). Nothing outside this list is eligible, so a path no list
# names fails closed. `scripts/enqueue-reviewed` reads this file at the live tip of
# `main`; a missing or unreadable file means every workflow-reviewed PR needs the
# operator. It does not widen anything for owner-attested reviews, the size
# trigger, or a verdict whose Risk is not `auto`.
#
# Why this is a list of what is allowed: a workflow review can say `risk: auto`, and
# a prompt-injected model can write that, so the safe default for a path nobody has
# classified is the operator. Add a path only after reading what it holds.
#
# Whatever `paths` says, the script never treats as eligible a path with a segment
# starting with `.` (.github, .claude, .gitattributes) or a file named AGENTS.md,
# CLAUDE.md or GEMINI.md in any directory (they can load as agent instructions),
# and a modify must keep mode 100644.
#
# Left out on purpose: docs/guides/** (it holds rule text AGENTS.md defers to, and a
# subdirectory CLAUDE.md or AGENTS.md can load as project instructions),
# src/wiki/**, src/overview/**, src/doctor/**, src/issue/** (identity, approval,
# secret, gate and execution logic), research/** (executable drivers), tests/,
# .github/, .claude/, infra/, crates/, scripts/, docs/roles/, src/protected_runtime/
# and every other path. Widening this list is a later, deliberate, reviewed change.
# Changing this file is class `human` (risk-classes.md trigger 7).

[auto]
paths = ["design-plans/**/*.md"]

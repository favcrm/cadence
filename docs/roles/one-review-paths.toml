# CAD-957: the ALLOWLIST of paths whose PRs need ONE independent review
# (standards + spec). Read by AGENTS.md "Review" and by scripts (CAD-959).
# Changing this file is class `human` (risk-classes.md trigger 7).
#
# Match semantics (a script must implement exactly this):
# - Diff source: `git diff --raw -z --no-renames <merge-base> <head>` (two-dot).
# - Every entry must have status A or M. Any other status disqualifies the PR.
#   Both modes (old and new) must be 100644 or 100755 (absent side of an A is
#   fine); any other mode (symlink 120000, submodule 160000) or any mode change
#   disqualifies.
# - Every path must match at least one `one_review_include` glob and no
#   `one_review_exclude` glob. Exclude wins.
# - Matching is case-sensitive and byte-exact, with no normalisation. A path
#   that starts with `./`, contains `..` or contains a backslash disqualifies.
# - Globs are repo-root-relative with `/` separators. `*` matches zero or
#   more non-`/` characters. `**` as a whole segment matches zero or more
#   whole segments. `?` and `[` are literal. No other wildcards.
# - An empty diff, an unreadable or malformed TOML file disqualifies.
# A disqualified PR keeps two reviews. `human` triggers apply on top.
#
# CAD-965 (operator decision 2026-10-01) put top-level integration tests on
# this list; CAD-1099 below supersedes it with a wider list. `tests/common/**`
# (harness and isolation code) stays two-review via the exclude list.
#
# CAD-1099 (operator decision 2026-10-03, "spec > dev > review > pr > deploy is
# taking too long"): ONE independent review is the default for normal code
# and docs. Two reviews also cover trigger 2-schema, whole sensitive source
# trees (src/daemon, src/bin, src/platform, src/adapter, src/store,
# src/agent_uid) and nested build/lock files, because risk-paths.toml is a
# delegation allowlist, not a complete map. UI (`ui/**`, `src/ui/**`) is trigger 1 and keeps two. Two reviews remain for every path in docs/roles/risk-paths.toml
# triggers 1 (trust boundary/identity), 3 (secrets), 4 (supply chain/CI),
# 6 (release/rollout) and 7 (rules/gates/their proofs), plus the remote-CLI
# auth modules below. Includes are explicit directories, so a new top-level
# path keeps two reviews until it is listed here. Exclude wins.

one_review_include = [
  "src/**",
  "docs/**",
  "tests/**",
  "skills/**",
  "apps/**",
  "app-previews/**",
  "workspace-apps/**",
  "workflows/**",
  "contracts/**",
  "design/**",
  "README.md",
  "CONTEXT.md",
  "CONTRIBUTING.md",
]
# Two reviews for these, even though an include glob matches them.
one_review_exclude = [
  # risk-paths.toml trigger 1: trust boundary and identity
  "src/peer.rs",
  "src/daemon.rs",
  "src/daemon/identity.rs",
  "src/daemon/caller_rule.rs",
  "src/daemon/slots_rpc.rs",
  "src/adapter/pty/**",
  "src/ui.rs",
  "src/ui/**",
  "ui/**",
  "src/operator_auth.rs",
  "src/tailnet_proof.rs",
  "src/test_seam.rs",
  "src/master_perm.rs",
  "src/agent_uid.rs",
  "src/cli/agent_uid.rs",
  # CAD-1099 review fix: risk-paths.toml is a delegation ALLOWLIST and was never
  # a complete map of identity/credential code, so whole sensitive trees keep
  # two reviews here (fail-safe, by directory).
  "src/daemon/**",
  "src/bin/**",
  "src/platform/**",
  "src/adapter/**",
  "src/store/**",
  "src/agent_uid/**",
  "src/cli/platform.rs",
  "src/pi_policy.rs",
  "src/confine.rs",
